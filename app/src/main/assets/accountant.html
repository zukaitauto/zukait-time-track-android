<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zukait Accountant</title>
<style>
:root{font-family:system-ui,sans-serif;color:#193247;background:#f3f7fa}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(23px,4vw,32px)}.notice{padding:14px;border:1px solid #e6c77d;border-radius:10px;background:#fff9e8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px}.tile{padding:20px;background:white;border:1px solid #d5e1e9;border-radius:12px}.tile h2{font-size:17px;margin:0 0 10px}.tile p{font-size:14px;color:#526879}.status{font-size:13px;color:#795b15}button{padding:11px 16px;border-radius:8px;border:1px solid #9cb5c7;background:#fff;color:#183a52;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.6}
</style></head><body><main>
<header><h1>Zukait · Accountant Dashboard</h1><button id="back" type="button">Back to login</button></header>
<p id="identity" role="status"></p>
<p class="notice" id="notice">Financial modules are being prepared. No accounting data or editing controls are available on this page yet.</p>
<section class="grid" aria-label="Accountant modules" id="modules"></section>
</main><script>
(function(){
'use strict';
const titles=['JC Search & 360° Financial View','Consumables Expenses','Paint Expenses','Spare Parts Expenses','Employee Leave Details','Cash In / Cash Out','Insurance LPO Tracking','Outstanding Payments','Monthly Financial Reports'];
const key='zukait_secure_session_v42';
let saved=null;try{saved=JSON.parse(localStorage.getItem(key)||'null')}catch(_){}
const notice=document.getElementById('notice');
const identity=document.getElementById('identity');
identity.textContent='Verifying Accountant session…';
async function verify(){
  const user=saved?.user;
  if(!user||user.role!=='Accountant')throw Error('Accountant sign-in required.');
  let token=String(saved?.token||'');
  if(!token){try{token=String(window.AndroidBridge?.getSecureSessionToken?.()||'')}catch(_){}}
  if(!token)throw Error('Session token unavailable. Sign in again.');
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),15000);
  let response;
  try{
    response=await fetch('https://pjknotnjkufadqavcmii.supabase.co/functions/v1/staff-auth',{
      method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_-sg597IpB0MLIHdDoedRIA_MTt0Sa9A'},
      body:JSON.stringify({action:'session',session_token:token}),signal:controller.signal
    });
  }finally{clearTimeout(timeout)}
  const result=await response.json();
  if(!response.ok||!result.ok||result.user?.role!=='Accountant'||result.user?.id!==user.id)throw Error('Accountant session invalid.');
  identity.textContent='Signed-in account: '+String(result.user.name||result.user.id);
  notice.textContent='Financial modules are being prepared. No accounting data or editing controls are available on this page yet.';
}
verify().catch(e=>{identity.textContent='Access not verified';notice.textContent=e.message+' Return to the sign-in screen.';document.getElementById('modules').replaceChildren();});
document.getElementById('modules').replaceChildren(...titles.map(title=>{
 const card=document.createElement('article');card.className='tile';
 const h=document.createElement('h2');h.textContent=title;
 const p=document.createElement('p');p.textContent='Awaiting secured financial API and verified data mapping';
 const status=document.createElement('span');status.className='status';status.textContent='Not available';
 card.append(h,p,status);return card;
}));
document.getElementById('back').onclick=()=>history.back();
})();
</script></body></html>
