<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zukait · Accountant</title><link rel="stylesheet" href="accountant.css?v=1"></head><body><main>
<header><div class="brand"><span class="mark" aria-hidden="true">Z</span><div><h1>Accountant Dashboard</h1><p id="identity">Verifying secure session…</p></div></div><div class="actions"><button id="manager-back" type="button" hidden>← Manager dashboard</button><button id="logout" type="button">Sign out</button></div></header>
<p id="message" role="status" aria-live="polite"></p><div id="pending" hidden class="notice"></div>
<section id="app" hidden><nav id="navigation" aria-label="Accountant modules"></nav>
<section class="filters"><label>Search<input id="query" type="search" maxlength="80" placeholder="JC / registration / customer / vehicle"></label><label>Month<input id="month" type="month"></label><label>From<input id="from" type="date"></label><label>To<input id="to" type="date"></label><label>Employee ID<input id="employee" maxlength="40"></label><label>Material<input id="material" maxlength="100"></label><label>Insurance company<input id="insurance" maxlength="100"></label><button id="refresh" type="button">Apply filters</button><button id="clear" type="button">Clear</button></section>
<section id="summary" class="summary" aria-label="Financial summary"></section>
<section class="panel"><div class="heading"><div><h2 id="title">JC Search &amp; 360° Financial View</h2><p id="report-meta"></p></div><div class="actions"><button id="cash-entry" type="button">＋ Cash entry</button><button id="pdf" type="button">PDF</button><button id="excel" type="button">Excel (.xml)</button></div></div><div id="notes" class="notice"></div><div id="rows"></div><div class="paging"><button id="previous" type="button">Previous</button><span id="page-status"></span><button id="next" type="button">Next</button></div></section>
<section id="detail" class="panel" hidden></section>
<form id="entry" class="panel" hidden><h2 id="entry-title">Cash transaction</h2><input id="operation" type="hidden" value="POST"><input id="entry-id" type="hidden"><div class="form-grid"><label>Direction<select id="kind"><option value="CASH_IN">Cash In</option><option value="CASH_OUT">Cash Out</option></select></label><label>Transaction date<input id="transaction-date" type="date" required></label><label>JC number (optional)<input id="entry-job" maxlength="40"></label><label>Customer / supplier / payee<input id="payee" required maxlength="200"></label><label>Amount (OMR)<input id="amount" type="number" min="0.001" max="1000000" step="0.001" required></label><label>Payment method<select id="method"><option>CASH</option><option>CARD</option><option>BANK</option><option>CHEQUE</option></select></label><label>Expense category (Cash Out)<input id="category" maxlength="100"></label><label>Reference number<input id="reference" maxlength="200"></label><label>Remarks<textarea id="remarks" maxlength="2000"></textarea></label><label>Reason / description<input id="reason" required minlength="3" maxlength="2000"></label></div><div class="actions"><button type="submit">Save with audit history</button><button id="cancel-entry" type="button">Cancel</button></div></form>
<form id="correction" class="panel" hidden><h2>Financial correction</h2><p id="correction-target"></p><label>Corrected amount (OMR)<input id="corrected-value" type="number" min="0" max="1000000" step="0.001" required></label><label>Reason<textarea id="correction-reason" required minlength="3" maxlength="2000"></textarea></label><div class="actions"><button type="submit">Record correction</button><button id="cancel-correction" type="button">Cancel</button></div></form>
<footer>Amounts are OMR · three decimal places. Financial records are corrected with an audit trail, never deleted.</footer></section>
</main><script src="vendor/pdf/html2canvas-1.4.1.min.js"></script><script src="vendor/pdf/jspdf-4.2.1.min.js"></script><script src="report_pdf_export.js?v=2026101405"></script><script src="accountant_exports.js?v=1"></script><script src="accountant.js?v=1"></script></body></html>
