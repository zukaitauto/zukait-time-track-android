<div id="login" class="card"><h2>Staff Login</h2><p class="muted">Workshop Production &amp; Time Tracking. Use your User ID and individual password.</p><div class="grid"><label>User ID<br><input id="uid" autocomplete="username" placeholder="EMP001 / SUP001 / MGR001"></label><label>Password<br><span class="password-wrap"><input id="pw" type="password" autocomplete="current-password" placeholder="Password"><button type="button" class="pw-eye" id="pwEye" aria-label="Show password" onclick="togglePasswordVisibility()">👁</button></span></label></div><p><button class="blue big-action" onclick="login()">Login</button></p></div>

</main><div id="modal" class="hidden"></div><script>

];
const defaultUsers=staffRoster;
const defaultPasswords={};
const initial={jobs:[{no:'JC1001',vehicle:'Toyota Corolla',reg:'OM-12345',status:'Open',createdBy:'SUP001',createdAt:new Date('2026-09-16T09:00:00').getTime()},{no:'JC1002',vehicle:'Nissan Patrol',reg:'OM-67890',status:'Open',createdBy:'SUP001',createdAt:new Date('2026-09-15T09:00:00').getTime()}],assign:[{id:'a1',job:'JC1001',emp:'EMP001',suggested:390,completed:false,rework:false,assignedBy:'SUP001',assignedAt:new Date('2026-09-16T09:00:00').getTime()},{id:'a2',job:'JC1002',emp:'EMP001',suggested:150,completed:false,rework:false,assignedBy:'SUP001',assignedAt:new Date('2026-09-15T09:00:00').getTime()},{id:'a3',job:'JC1001',emp:'EMP002',suggested:270,completed:false,rework:false,assignedBy:'SUP001',assignedAt:new Date('2026-09-16T09:30:00').getTime()}],sessions:[],corrections:[],jobEdits:[],suggestedEdits:[],reworks:[],requests:[]};
let state=null,me=null,employeeClockTimer=null;
function loadSavedState(){try{const raw=window.localStorage.getItem(KEY);if(!raw)return structuredClone(initial);const parsed=JSON.parse(raw);return parsed&&typeof parsed==='object'?parsed:structuredClone(initial)}catch(e){console.warn('Local storage unavailable or invalid; using in-memory test data.',e);return structuredClone(initial)}}
state=loadSavedState();
state.requests=state.requests||[]; state.additionalActions=state.additionalActions||[]; state.attentionDismissed=state.attentionDismissed||[]; state.suggestedEdits=state.suggestedEdits||[]; state.reworks=state.reworks||[]; state.lastActions=state.lastActions||{}; state.jobDeletes=state.jobDeletes||[];
let users=state.users||structuredClone(defaultUsers),passwords=state.passwords||structuredClone(defaultPasswords);
let liveSupervisorTimer=null;
// Upgrade older local-test data to the complete staff roster without deleting jobs or sessions.
(function migrateRoster(){
  const byId=new Map(users.map(u=>[u.id,u]));
  staffRoster.forEach(u=>{if(!byId.has(u.id)) users.push(structuredClone(u)); else {byId.get(u.id).name=u.name;byId.get(u.id).role=u.role;byId.get(u.id).department=u.department;}});
  save();
})();
function save(){state.users=users;state.passwords=passwords;try{window.localStorage.setItem(KEY,JSON.stringify(state));}catch(e){console.warn('Local storage unavailable; changes remain in this session.',e)}if(typeof window.cloudScheduleSave==='function')window.cloudScheduleSave()} function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())} function now(){return Date.now()} function fmt(m){m=Math.max(0,Math.round(m));return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'} function signedFmt(m){return (m<0?'- ':'')+fmt(Math.abs(m))} function user(id){return users.find(x=>x.id===id)||{name:id,role:'Unknown'}} function parseWorkMinutes(value){let raw=String(value??'').trim().replace(',', '.');if(!raw)return NaN;if(/^\d+\s*:\s*\d{1,2}$/.test(raw)){let parts=raw.split(':');let h=Number(parts[0]),m=Number(parts[1]);return h*60+m}if(!/^\d+(?:\.\d+)?$/.test(raw))return NaN;let parts=raw.split('.'),h=Number(parts[0]),mins=parts.length>1?Number((parts[1]+'00').slice(0,2)):0;if(mins>59)return NaN;return h*60+mins} function timeInputHint(){return 'Enter H.MM or H:MM — e.g. 2.30 = 2h 30m, 2.45 = 2h 45m'}
function job(no){return state.jobs.find(j=>j.no===no)} function assignment(no,emp){return state.assign.find(a=>a.job===no&&a.emp===emp)} function activeSession(emp){return state.sessions.find(s=>s.emp===emp&&!s.end)} function setLastAction(text){state.lastActions=state.lastActions||{};state.lastActions[me.id]={text,at:now()}}
function deptClass(dept){return 'dept-'+String(dept||'').toLowerCase().replace(/\s+/g,'-')} function userLabel(id){let u=user(id);return '<span class="'+deptClass(u.department)+'">'+u.name+'</span>'}
function total(no,emp){return state.sessions.filter(s=>s.job===no&&s.emp===emp).reduce((a,s)=>a+window.sessionNormalMinutes(s,now()),0)} function totalForAssignment(a){return a?total(a.job,a.emp):0} function effA(a){let ac=totalForAssignment(a),sg=a?a.suggested:0;return ac?sg/ac*100:null} function suggest(no,emp){let a=assignment(no,emp);return a?a.suggested:0} function eff(no,emp){let a=total(no,emp),s=suggest(no,emp);return a?s/a*100:null}
function dayBounds(ts=now()){let d=new Date(ts);let start=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();return [start,start+86400000]}
function dailySessions(emp,ts=now()){let [start,end]=dayBounds(ts);return state.sessions.filter(s=>s.emp===emp&&s.start<end&&(s.end||now())>start).sort((a,b)=>a.start-b.start)}
function productiveOverlapMinutes(start,end){if(end<=start)return 0;let total=0,d=new Date(start);for(let day=0;day<3;day++){let base=new Date(d.getFullYear(),d.getMonth(),d.getDate()+day);let windows=[[8,15,13,0],[15,0,19,0]];for(let w of windows){let a=new Date(base.getFullYear(),base.getMonth(),base.getDate(),w[0],w[1]).getTime(),b=new Date(base.getFullYear(),base.getMonth(),base.getDate(),w[2],w[3]).getTime();let x=Math.max(start,a),y=Math.min(end,b);if(y>x)total+=(y-x)/60000}}return total} function idleMinutes(emp,ts=now()){let ss=dailySessions(emp,ts),idle=0;for(let i=1;i<ss.length;i++){let gapStart=ss[i-1].end||now(),gapEnd=ss[i].start;if(gapEnd>gapStart)idle+=productiveOverlapMinutes(gapStart,gapEnd);}return idle} function monthlyIdleMinutes(emp,ts=now()){let d=new Date(ts),start=new Date(d.getFullYear(),d.getMonth(),1).getTime(),end=new Date(d.getFullYear(),d.getMonth()+1,1).getTime(),idle=0;for(let day=start;day<end;day+=86400000)idle+=idleMinutes(emp,Math.min(day+12*3600000,end-1));return idle}
function actualMinutesForDay(emp,ts=now()){let [start,end]=dayBounds(ts);return dailySessions(emp,ts).reduce((sum,s)=>sum+Math.max(0,(Math.min(s.end||now(),end)-Math.max(s.start,start))/60000),0)}
function activeSuggestedForDay(emp,ts=now()){let ss=dailySessions(emp,ts),jobs=[...new Set(ss.map(s=>s.job))];return jobs.reduce((sum,no)=>{let actual=total(no,emp);return sum+(actual>0?suggest(no,emp):0)},0)}
function dailyRemaining(emp,ts=now()){let actual=actualMinutesForDay(emp,ts),suggested=activeSuggestedForDay(emp,ts);return suggested-actual}
function overStatus(a){let actual=total(a.job,a.emp);return actual>0&&actual>a.suggested}
function empStatus(a){let active=activeSession(a.emp); if(active&&active.job===a.job)return 'Started'; if(a.completed)return 'Finished'; let last=state.sessions.filter(s=>s.job===a.job&&s.emp===a.emp).sort((x,y)=>y.start-x.start)[0]; if(last&&last.paused)return 'Paused'; return 'New'}
function statusHTML(s){let c=s==='Started'?'start':s==='Paused'?'pause':s==='Finished'?'finish':s==='Rework'?'rework':s==='New'?'new':'ready';return '<span class="status '+c+'">'+s.toUpperCase()+'</span>'}

="hidden">'+supervisorRequests()+'</div></div><div class="card"><h3>⏱ Additional Time</h3><p class="muted">Supervisor can manually add extra suggested time for an employee.</p><button class="blue" onclick="manualAdditionalTime()">Add Additional Time</button></div><details class="card"><summary><b>Additional Action History</b></summary><div style="margin-top:12px">'+additionalActionHistory()+'</div></details><div class="card"><h3>Assigned Job Cards</h3><p><input id="assignedSearch" placeholder="Search job card, registration or technician" oninput="filterSupervisorRows(&apos;assignedRows&apos;,&apos;assignedSearch&apos;)"></p>'+reportTable('supervisor')+'</div><details class="card"><summary><b>Finished Job Cards</b> <span class="muted">Completed work is kept separate</span></summary><p><input id="completedSearch" placeholder="Search job card or registration" oninput="filterSupervisorRows(&apos;completedRows&apos;,&apos;completedSearch&apos;)"></p>'+completedTable('supervisor')+'</details>'; }
function supervisorRequests(){let rows=state.requests.slice().sort((a,b)=>b.createdAt-a.createdAt);if(!rows.length)return '<p class="muted">No employee requests.</p>';return rows.map(r=>{let status=r.status==='New'?'<span class="status new">NEW</span>':'<span class="status finish">'+r.status.toUpperCase()+'</span>';let actions='';if(r.status==='New'){if(r.type==='more_time')actions='<button class="green" onclick="approveRequest(\''+r.id+'\')">Approve</button><button class="danger" onclick="rejectRequest(\''+r.id+'\')">Reject</button>';else actions='<button class="blue" onclick="ackRequest(\''+r.id+'\')">Mark Read</button>';}return '<div class="drop-row"><b>'+user(r.emp).name+'</b> · '+r.job+' · '+(r.type==='more_time'?'⏱ More Time':r.type==='problem'?'⚠ Problem':'🎤 Inform')+' '+status+'<br><span class="small">'+new Date(r.createdAt).toLocaleString()+(r.minutes?' · Requested +'+r.minutes+' min':'')+'</span><p style="margin:6px 0">'+(r.message||'No text message')+'</p>'+(r.response?'<p class="small"><b>Response:</b> '+r.response+'</p>':'')+actions+'</div>'}).join('')}
function manualAdditionalTime(){let jobNo=prompt('Job Card Number');if(jobNo===null)return;jobNo=jobNo.trim().toUpperCase();if(!job(jobNo))return alert('Job Card not found.');let choices=state.assign.filter(a=>a.job===jobNo&&!a.completed);if(!choices.length)return alert('No active employee assignment found for this job.');let emp=choices.length===1?choices[0].emp:prompt('Employee code for additional time\n'+choices.map(a=>user(a.emp).name+' ('+a.emp+')').join('\n'),choices[0].emp);if(emp===null)return;emp=String(emp).trim().toUpperCase();let a=assignment(jobNo,emp);if(!a)return alert('Employee assignment not found.');let n=prompt('Additional time in minutes','30');if(n===null)return;n=Number(n);if(!Number.isFinite(n)||n<1)return alert('Enter valid additional minutes.');let old=a.suggested;a.suggested+=n;let at=now();state.additionalActions.push({id:uid(),type:'Additional Time',job:jobNo,emp,minutes:n,oldSuggested:old,newSuggested:a.suggested,by:me.id,at,source:'Manual Supervisor Action'});state.suggestedEdits.push({job:jobNo,emp,old,newValue:a.suggested,by:me.id,at,source:'Manual Additional Time'});setLastAction('Added '+n+' min to '+jobNo+' for '+user(emp).name);save();render()}
function additionalActionHistory(){let rows=(state.additionalActions||[]).slice().sort((a,b)=>b.at-a.at);if(!rows.length)return '<p class="muted">No additional-time actions yet.</p>';return rows.map(x=>'<div class="drop-row"><b>'+x.job+'</b> · '+user(x.emp).name+' ('+x.emp+')<br><span class="small">'+new Date(x.at).toLocaleString()+' · +'+x.minutes+' min · Suggested '+fmt(x.oldSuggested)+' → '+fmt(x.newSuggested)+' · By '+user(x.by).name+'</span></div>').join('')}
function approveRequest(id){let r=state.requests.find(x=>x.id===id);if(!r)return;let a=assignment(r.job,r.emp);if(!a)return alert('Assignment no longer exists.');a.suggested+=r.minutes;state.suggestedEdits.push({job:r.job,emp:r.emp,old:a.suggested-r.minutes,newValue:a.suggested,by:me.id,at:now(),source:'Approved More Time Request'});r.status='Approved';r.respondedAt=now();r.responseBy=me.id;r.response='Approved +'+r.minutes+' minutes';setLastAction('Approved more time for '+r.job);save();render()}
function rejectRequest(id){let r=state.requests.find(x=>x.id===id);if(!r)return;let reason=prompt('Optional reason for rejecting this request:','Please continue with the current suggested time.');if(reason===null)return;r.status='Rejected';r.respondedAt=now();r.responseBy=me.id;r.response=reason||'Request rejected';save();render()}
function ackRequest(id){let r=state.requests.find(x=>x.id===id);if(!r)return;r.status='Read';r.respondedAt=now();r.responseBy=me.id;r.response='Received by supervisor';save();render()}
function createAndAssignJob(){let no=document.getElementById('newNo').value.trim().toUpperCase(),v=document.getElementById('newVehicle').value.trim(),r=document.getElementById('newReg').value.trim().toUpperCase(),emp=document.getElementById('se').value,s=parseWorkMinutes(document.getElementById('st').value);if(!no||!v||!r||!emp||!Number.isFinite(s)||s<1)return alert('Enter Job Card, vehicle, registration, technician and valid suggested time. '+timeInputHint());if(job(no))return alert('Job Card Number already exists.');state.jobs.push({no,vehicle:v,reg:r,status:'Open',createdBy:me.id,createdAt:now()});state.assign.push({id:uid(),job:no,emp,suggested:s,completed:false,rework:false,assignedBy:me.id,assignedAt:now()});setLastAction('Created and assigned '+no+' to '+user(emp).name);save();render()}
function assignJobExisting(){let no=document.getElementById('sj').value,emp=document.getElementById('se2').value,s=parseWorkMinutes(document.getElementById('st2').value);assignJobCore(no,emp,s)}
function assignJobCore(no,emp,s){if(!Number.isFinite(s)||s<1)return alert('Enter valid suggested time. '+timeInputHint());let a=assignment(no,emp);if(a){let old=a.suggested;a.suggested=s;a.assignedBy=me.id;a.assignedAt=now();state.suggestedEdits.push({job:no,emp,old,newValue:s,by:me.id,at:now(),source:'Supervisor'});a.completed=false;a.rework=false}else state.assign.push({id:uid(),job:no,emp,suggested:s,completed:false,rework:false,assignedBy:me.id,assignedAt:now()});setLastAction('Assigned '+no+' to '+user(emp).name);save();render()}
function assignmentSortValue(a){let st=empStatus(a);return st==='New'?0:st==='Started'?1:st==='Paused'?2:3}
function supervisorOverview(assigned,techs){
  let active=assigned.filter(a=>{let s=activeSession(a.emp);return s&&s.job===a.job}).length;
  let paused=assigned.filter(a=>empStatus(a)==='Paused').length;
  let completedJobs=new Set(assigned.filter(a=>a.completed).map(a=>a.job)).size;
  let overdue=assigned.filter(a=>!a.completed&&overStatus(a));
  let attention=assigned.filter(a=>(empStatus(a)==='Paused'||overStatus(a))&&!isAttentionDismissed(a));
  let board=techs.map(id=>{let workerJobs=state.assign.filter(a=>a.emp===id),current=workerJobs.find(a=>empStatus(a)==='Started')||workerJobs.find(a=>empStatus(a)==='Paused')||workerJobs.find(a=>!a.completed),status=current?empStatus(current):'Available',actual=actualMinutesForDay(id),idle=idleMinutes(id),remaining=dailyRemaining(id),currentText=current?`<p><b>${current.job}</b><br>${job(current.job).reg}<br>Actual: ${fmt(total(current.job,id))}<br>${overStatus(current)?`<span class="over-alert">EXCEEDED ${fmt(total(current.job,id)-current.suggested)}</span>`:`<span class="remaining">Remaining ${fmt(Math.max(0,current.suggested-total(current.job,id)))}</span>`}</p>`:`<p class="muted">No active assignment</p>`;return `<div class="job-card"><h4>${userLabel(id)} <span class="small">${user(id).department}</span></h4><p class="muted">${id}</p>${statusHTML(status)}${currentText}<p class="small"><b>Today Work:</b> ${fmt(actual)} · <b>Idle:</b> ${fmt(idle)} · <b>${remaining>=0?'Remaining':'Exceeded'}:</b> ${fmt(Math.abs(remaining))}</p><button class="blue" onclick="openSupervisorTechnician('${id}')">View jobs</button></div>`}).join('');
  let attentionTable=attention.length?`<table><tr><th>Technician</th><th>Department</th><th>Job</th><th>Status</th><th>Reason</th><th>Action</th></tr>${attention.map(a=>`<tr><td>${userLabel(a.emp)}</td><td>${user(a.emp).department}</td><td>${a.job}</td><td>${statusHTML(empStatus(a))}</td><td>${empStatus(a)==='Paused'?'Work is paused':'Exceeded suggested time by '+fmt(totalForAssignment(a)-a.suggested)}</td><td><button class="blue" onclick="openSupervisorJob('${a.job}')">View Job</button><button class="secondary" onclick="dismissAttention('${a.id}')">✓ Checked / Remove</button></td></tr>`).join('')}</table>`:'<p class="ok">No jobs need attention right now.</p>';
  return `<div class="card"><h3><span class="live-dot"></span>Today at a Glance <span class="small muted live-data-refresh">${new Date().toLocaleTimeString()}</span></h3><p class="muted small">Live technician status. Click a count to inspect job cards. The detail window stays open until you press Close.</p><div class="grid"><div class="notice clickable" onclick="openActiveWorkers()"><b>Active Workers</b><div class="stat">${active}</div><span class="small muted">Click to view by work type</span></div><div class="notice clickable" onclick="openGlanceList('paused')"><b>Paused Jobs</b><div class="stat">${paused}</div></div><div class="notice clickable" onclick="openGlanceList('completed')"><b>Finished Job Cards</b><div class="stat">${completedJobs}</div></div><div class="notice clickable" onclick="openGlanceList('overdue')"><b>Over Suggested Time</b><div class="stat">${overdue.length}</div></div></div></div><div class="card"><h3>Technician Board — Live</h3><div class="grid">${board}</div><div id="supervisorTechDetail"></div></div><div class="card"><h3>Needs Attention <span class="pill">Manual check required</span></h3>${attentionTable}</div>`;
}
function showSupervisorModal(title,body){let modal=document.getElementById('modal');modal.className='modal-backdrop';modal.innerHTML='<div class="modal-box" onclick="event.stopPropagation()"><div class="section-title"><h3>'+title+'</h3><button class="secondary" onclick="closeSupervisorModal()">Close</button></div>'+body+'</div>';}
function closeSupervisorModal(){let modal=document.getElementById('modal');modal.className='hidden';modal.innerHTML='';}
function openGlanceList(type){let rows=state.assign,title={paused:'Paused Job Cards',completed:'Finished Job Cards',overdue:'Over Suggested Time'}[type],matches=type==='paused'?rows.filter(a=>empStatus(a)==='Paused'):type==='completed'?rows.filter(a=>a.completed):rows.filter(a=>!a.completed&&overStatus(a)),numbers=[...new Set(matches.map(a=>a.job))];showSupervisorModal(title,numbers.length?'<p class="muted">Select a job card. The detail window will remain open until you press Close.</p><div class="grid">'+numbers.map(no=>'<button class="blue" onclick="openSupervisorJob(\''+no+'\')">View '+no+'</button>').join('')+'</div>':'<p class="muted">No job cards in this list.</p>')}
function openSupervisorJob(no){let j=job(no);if(!j)return showSupervisorModal('Job Card','<p class="muted">Job card not found.</p>');let rows=state.assign.filter(a=>a.job===no);showSupervisorModal('Job Card '+no,'<div class="notice"><b>Vehicle:</b> '+j.vehicle+'<br><b>Registration:</b> '+j.reg+'</div><table><tr><th>Technician</th><th>Status</th><th>Suggested</th><th>Actual</th><th>Efficiency</th></tr>'+rows.map(a=>{let actual=totalForAssignment(a),e=effA(a);return '<tr><td>'+user(a.emp).name+' ('+a.emp+')</td><td>'+statusHTML(empStatus(a))+'</td><td>'+fmt(a.suggested)+'</td><td>'+fmt(actual)+'</td><td>'+(e===null?'—':e.toFixed(1)+'%')+'</td></tr>'}).join('')+'</table>')}
function createJob(){let no=document.getElementById('newNo').value.trim().toUpperCase(),v=document.getElementById('newVehicle').value.trim(),r=document.getElementById('newReg').value.trim().toUpperCase();if(!no||!v||!r)return alert('Enter Job Card Number, Vehicle Details and Registration Number.');if(job(no))return alert('Job Card Number already exists.');state.jobs.push({no,vehicle:v,reg:r,status:'Open',createdBy:me.id,createdAt:now()});save();render()}
function assignJob(){assignJobExisting()}
function filterSupervisorRows(rowClass,inputId){let q=document.getElementById(inputId).value.trim().toLowerCase();document.querySelectorAll('.'+rowClass).forEach(row=>row.style.display=!q||row.dataset.search.includes(q)?'':'none')}
function openSupervisorTechnician(emp){let u=user(emp),rows=state.assign.filter(a=>a.emp===emp),active=rows.filter(a=>!a.completed);showSupervisorModal(u.name+' — Job Cards','<p class="muted">Presently assigned job cards: <b>'+active.length+'</b></p>'+assignmentTable(active));}
function openActiveWorkers(){let deps=['Denter','Painter','Mechanic'];showSupervisorModal('Active Workers','<p class="muted">Choose a work type to see workers currently working and their present job-card count.</p><div class="grid">'+deps.map(d=>'<button class="blue big-action" onclick="openActiveWorkersDept(\''+d+'\')">'+d+' <span class="small">('+users.filter(u=>u.role==='Employee'&&u.department===d&&activeSession(u.id)).length+')</span></button>').join('')+'</div>');}
function openActiveWorkersDept(dept){let list=users.filter(u=>u.role==='Employee'&&u.department===dept&&activeSession(u.id));let body=list.length?'<table><tr><th>Worker</th><th>Current Job</th><th>Job Cards Under Worker</th></tr>'+list.map(u=>{let current=activeSession(u.id),count=state.assign.filter(a=>a.emp===u.id&&!a.completed).length;return '<tr><td>'+userLabel(u.id)+'<br><span class="small">'+u.id+'</span></td><td>'+(current?current.job:'—')+'</td><td><b>'+count+' job card'+(count===1?'':'s')+'</b></td></tr>'}).join('')+'</table>':'<p class="muted">No workers currently working in '+dept+'.</p>';showSupervisorModal(dept+' Workers',body);}
function showSupervisorTechnician(emp){let rows=state.assign.filter(a=>a.emp===emp),target=document.getElementById('supervisorTechDetail');target.innerHTML='<h4>'+user(emp).name+' — Job Cards</h4>'+assignmentTable(rows)}
function assignmentTable(rows,rowClass=''){if(!rows.length)return '<p class="muted">No job cards found.</p>';return '<table><tr><th>Job Card</th><th>Registration</th><th>Status</th><th>Suggested</th><th>Actual</th><th>Assigned By</th><th>Pause Reason</th></tr>'+rows.slice().sort((a,b)=>assignmentSortValue(a)-assignmentSortValue(b)).map(a=>{let j=job(a.job);return '<tr class="'+rowClass+'" data-search="'+(a.job+' '+j.reg+' '+user(a.emp).name).toLowerCase()+'"><td>'+a.job+'</td><td>'+j.reg+'</td><td>'+statusHTML(empStatus(a))+'</td><td>'+fmt(a.suggested)+'</td><td>'+fmt(total(a.job,a.emp))+'</td><td class="small">'+(a.assignedAt?new Date(a.assignedAt).toLocaleString():'—')+'</td><td class="assigned-by">'+user(a.assignedBy).name+'</td><td class="small">'+(a.pauseReason||'—')+'</td></tr>'}).join('')+'</table>'}
function reportTable(role){let rows=state.assign.filter(a=>!a.completed).slice().sort((a,b)=>assignmentSortValue(a)-assignmentSortValue(b)||(b.assignedAt||0)-(a.assignedAt||0));return '<table><tr><th>Employee</th><th>Department</th><th>Job Card</th><th>Vehicle</th><th>Status</th><th>Suggested</th><th>Actual</th><th>Remaining / Exceeded</th><th>Assigned Date & Time</th><th>Assigned By</th><th>Pause Reason</th><th>Action</th></tr>'+rows.map(a=>{let j=job(a.job),st=empStatus(a),e=eff(a.job,a.emp),actions=role==='supervisor'?(total(a.job,a.emp)===0?'<button onclick="reassign(\''+a.id+'\')">Reassign</button>':'<span class="muted small">Work logged</span>'):'';return '<tr class="'+(role==='supervisor'?'assignedRows':'')+'" data-search="'+(a.job+' '+j.reg+' '+user(a.emp).name).toLowerCase()+'"><td>'+userLabel(a.emp)+'<br><span class="small muted">'+a.emp+'</span></td><td>'+user(a.emp).department+'</td><td>'+a.job+'</td><td>'+j.vehicle+' / '+j.reg+'</td><td>'+statusHTML(st)+'</td><td>'+fmt(a.suggested)+' '+(role==='supervisor'?'<button onclick="editSuggested(\''+a.id+'\')">Edit</button>':'')+'</td><td>'+fmt(total(a.job,a.emp))+'</td><td>'+(overStatus(a)?'<span class="over-alert">EXCEEDED '+fmt(total(a.job,a.emp)-a.suggested)+'</span>':'<span class="remaining">'+(total(a.job,a.emp)>0?'Remaining '+fmt(Math.max(0,a.suggested-total(a.job,a.emp))):'—')+'</span>')+'</td><td class="small">'+(a.assignedAt?new Date(a.assignedAt).toLocaleString():'—')+'</td><td class="assigned-by">'+user(a.assignedBy).name+'</td><td class="small">'+(a.pauseReason||'—')+'</td><td>'+actions+'</td></tr>'}).join('')+'</table>'}
function completedTable(role){let rows=state.assign.filter(a=>a.completed).slice().sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));if(!rows.length)return '<p class="muted">No completed work yet.</p>';return '<table><tr><th>Employee</th><th>Job Card</th><th>Vehicle</th><th>Suggested</th><th>Actual</th><th>Efficiency</th><th>Completion Date & Time</th><th>Assigned By</th></tr>'+rows.map(a=>{let j=job(a.job),e=eff(a.job,a.emp);return '<tr class="'+(role==='supervisor'?'completedRows':'')+'" data-search="'+(a.job+' '+j.reg+' '+user(a.emp).name).toLowerCase()+'"><td>'+userLabel(a.emp)+'</td><td>'+a.job+'</td><td>'+j.vehicle+' / '+j.reg+'</td><td>'+fmt(a.suggested)+'</td><td>'+fmt(total(a.job,a.emp))+'</td><td>'+(e==null?'—':e.toFixed(1)+'%')+'</td><td class="small">'+(a.completedAt?new Date(a.completedAt).toLocaleString():'—')+'</td><td class="assigned-by">'+user(a.assignedBy).name+'</td></tr>'}).join('')+'</table>'}
function editSuggested(id){let a=state.assign.find(x=>x.id===id);if(!a)return;let n=prompt('New Suggested Time (H.MM or H:MM)',fmt(a.suggested).replace('h ','.').replace('m',''));if(n===null)return;n=parseWorkMinutes(n);if(!Number.isFinite(n)||n<1)return alert('Invalid suggested time. '+timeInputHint());let old=a.suggested;a.suggested=n;state.suggestedEdits.push({job:a.job,emp:a.emp,old,newValue:n,by:me.id,at:now(),source:'Supervisor'});save();render()}
function reassign(id){let a=state.assign.find(x=>x.id===id);if(!a)return;if(total(a.job,a.emp)>0)return alert('This job already has recorded work and cannot be reassigned. Use Restart / Add Work instead.');let code=prompt('New employee code',a.emp);if(code===null)return;code=code.trim().toUpperCase();if(code===a.emp)return;if(user(code).role!=='Employee')return alert('Enter a valid employee code.');if(assignment(a.job,code))return alert('This employee is already assigned to this job card.');a.emp=code;save();render()}
function rework(id){let a=state.assign.find(x=>x.id===id);if(!a||!a.completed)return;let choice=prompt('Restart / Add Work:\n1 = restart using the previous Suggested Time ('+fmt(a.suggested)+')\n2 = add additional Suggested Time\n\nEnter 1 or 2','1');if(choice===null)return;let old=a.suggested,added=0;if(choice==='2'){let n=prompt('Additional Suggested Time (H.MM or H:MM)','1.00');if(n===null)return;added=parseWorkMinutes(n);if(!Number.isFinite(added)||added<1)return alert('Invalid additional suggested time. '+timeInputHint());a.suggested=old+added}else if(choice!=='1')return alert('Enter 1 or 2.');a.completed=false;a.rework=true;state.reworks.push({job:a.job,emp:a.emp,oldSuggested:old,additionalSuggested:added,newSuggested:a.suggested,by:me.id,at:now()});state.suggestedEdits.push({job:a.job,emp:a.emp,old,newValue:a.suggested,by:me.id,at:now(),source:choice==='1'?'Restart':'Additional work'});save();render()}
function managerMonthStats(){let d=new Date(),from=new Date(d.getFullYear(),d.getMonth(),1).getTime(),to=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();let rows=state.assign.filter(a=>{let ss=state.sessions.filter(s=>s.emp===a.emp&&s.job===a.job);return ss.some(s=>s.start<to&&(s.end||now())>from)||(a.assignedAt||0)>=from&&(a.assignedAt||0)<to});let suggested=rows.reduce((x,a)=>x+a.suggested,0),actual=rows.reduce((x,a)=>x+total(a.job,a.emp),0);return {jobs:new Set(rows.map(a=>a.job)).size,completed:new Set(rows.filter(a=>a.completed).map(a=>a.job)).size,inProgress:new Set(rows.filter(a=>!a.completed).map(a=>a.job)).size,suggested,actual,eff:actual?suggested/actual*100:null}}
function managerTodayStats(){let d=new Date(),from=new Date(d.getFullYear(),d.getMonth(),d.getDate(),8,0).getTime(),to=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,0,0).getTime();let active=users.filter(u=>u.role==='Employee'&&activeSession(u.id)).length,paused=users.filter(u=>u.role==='Employee'&&state.sessions.some(s=>s.emp===u.id&&s.paused&&!s.end&&s.start>=from&&s.start<to)).length;let rows=state.assign.filter(a=>{let ss=state.sessions.filter(s=>s.emp===a.emp&&s.job===a.job);return ss.some(s=>s.start<to&&(s.end||now())>from)||(a.assignedAt||0)>=from&&(a.assignedAt||0)<to});return {active,paused,jobs:new Set(rows.map(a=>a.job)).size,completed:new Set(rows.filter(a=>a.completed).map(a=>a.job)).size}}

// V31 fix: make normalOverlapMinutes available to all dashboard/report code before later overtime IIFE loads.
function normalOverlapMinutes(start,end){
  if(end<=start)return 0;
  let total=0,cur=start;
  while(cur<end){
    let d=new Date(cur),dayStart=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),next=dayStart+86400000,segEnd=Math.min(end,next);
    if(d.getDay()!==5){
      let w1a=dayStart+8*3600000+15*60000,w1b=dayStart+13*3600000;
      let w2a=dayStart+15*3600000,w2b=dayStart+19*3600000;
      total+=Math.max(0,(Math.min(segEnd,w1b)-Math.max(cur,w1a))/60000);
      total+=Math.max(0,(Math.min(segEnd,w2b)-Math.max(cur,w2a))/60000);
    }
    cur=segEnd;
  }
  return Math.max(0,total);
}

ome(s=>s.start<=to&&(s.end||now())>=from)||(a.assignedAt||0)>=from&&(a.assignedAt||0)<=to}).map(a=>{let j=job(a.job),ac=total(a.job,a.emp),e=ac?a.suggested/ac*100:null;return [user(a.emp).name,a.job,j.vehicle,j.reg,fmt(a.suggested),fmt(ac),e==null?'':e.toFixed(1)+'%',empStatus(a)]});filename='zukait-monthly-production-'+v}downloadExcelFile(filename,headers,rows)}

  function completedNonRepeatActual(emp,from,to){return state.sessions.filter(s=>s.emp===emp&&s.rework!==true&&s.start<to&&(s.end||now())>from).reduce((x,s)=>{let a=state.assign.find(v=>v.id===s.assignmentId||(!v.assignmentId&&v.job===s.job&&v.emp===s.emp&&!v.rework)); if(a&&a.completed)return x+Math.max(0,(Math.min(s.end||now(),to)-Math.max(s.start,from))/60000); return x},0)}

  function incentiveFor(emp){
    let [from,to]=monthBounds();
    let actual=state.sessions.filter(s=>s.emp===emp&&s.rework!==true&&s.start<to&&(s.end||now())>from).reduce((x,s)=>{
      let a=state.assign.find(v=>v.id===s.assignmentId||(!s.assignmentId&&v.job===s.job&&v.emp===s.emp&&!v.rework));
      if(a&&a.completed){
        let st=Math.max(s.start,from), en=Math.min(s.end||now(),to);
        return x+normalOverlapMinutes(st,en);
      } return x;
    },0);
    let repeat=state.sessions.filter(s=>s.emp===emp&&s.rework===true&&s.start<to&&(s.end||now())>from).reduce((x,s)=>x+normalOverlapMinutes(Math.max(s.start,from),Math.min(s.end||now(),to)),0);

  };
  function glanceBox(cls,icon,title,rows,action){let jobs=[...new Set(rows.map(a=>a.job))],sg=rows.reduce((x,a)=>x+a.suggested,0),ac=rows.reduce((x,a)=>x+totalForAssignment(a),0);return `<div class="glance-box ${cls} clickable" onclick="${action}"><div class="glance-icon">${icon}</div><div><b>${title}</b><div class="glance-num">${jobs.length}</div><span class="small">Suggested: ${fmt(sg)} · Actual: ${fmt(ac)}</span></div></div>`};window.glanceBox=glanceBox

<script>
(function(){
  // V28 FINAL: authoritative time calculations and contrast polish.
  window.sessionNormalMinutes=function(s,to=Date.now()){
    let end=Math.min(s.end||to,to); if(end<=s.start)return 0;
    let total=0,cur=s.start;
    while(cur<end){
      let d=new Date(cur),ds=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),de=ds+86400000,se=Math.min(end,de);
      if(d.getDay()!==5){
        const a1=ds+8*3600000+15*60000,b1=ds+13*3600000,a2=ds+15*3600000,b2=ds+19*3600000;
        total+=Math.max(0,(Math.min(se,b1)-Math.max(cur,a1))/60000);
        total+=Math.max(0,(Math.min(se,b2)-Math.max(cur,a2))/60000);
      }
      cur=se;
    }
    return Math.max(0,total);
  };
  window.sessionOvertimeMinutes=function(s,to=Date.now()){
    let end=Math.min(s.end||to,to); if(end<=s.start)return 0;
    let total=0,cur=s.start;
    while(cur<end){
      let d=new Date(cur),ds=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),de=ds+86400000,se=Math.min(end,de);
      if(d.getDay()===5) total+=(se-cur)/60000;
      else {
        const lunch=ds+13*3600000, evening=ds+19*3600000;
        total+=Math.max(0,(Math.min(se,ds+15*3600000)-Math.max(cur,lunch))/60000);
        total+=Math.max(0,(se-Math.max(cur,evening))/60000);
      }
      cur=se;
    }
    return Math.max(0,total);
  };
  window.overtimeForSession=window.sessionOvertimeMinutes;
  window.overtimeForEmployee=function(emp,from,to){return (state.sessions||[]).filter(s=>s.emp===emp&&s.start<to&&(s.end||Date.now())>from).reduce((x,s)=>x+window.sessionOvertimeMinutes(s,to),0)};
  window.monthlyNormalActualMinutes=function(emp,from,to){
    return (state.sessions||[]).filter(s=>s.emp===emp&&s.start<to&&(s.end||Date.now())>from).reduce((x,s)=>{
      let a=Math.max(s.start,from),b=Math.min(s.end||Date.now(),to); return x+window.sessionNormalMinutes({start:a,end:b},b);
    },0);
  };
  // Ideal time remains the assigned total for the month; efficiency is completed-only.
  window.completedEfficiency=function(emp,from,to){

    let sg=rows.reduce((x,a)=>x+a.suggested,0), ac=0;
    rows.forEach(a=>{(state.sessions||[]).filter(s=>s.emp===emp&&s.job===a.job&&s.start<to&&(s.end||Date.now())>from).forEach(s=>{let aa=Math.max(s.start,from),bb=Math.min(s.end||Date.now(),to);ac+=window.sessionNormalMinutes({start:aa,end:bb},bb);});});
    return {suggested:sg,actual:ac,efficiency:ac?sg/ac*100:null};
  };
  // Automatic duty-time split. This creates a distinct overtime segment at the exact duty boundary.
  window.v28AutoDutySplit=function(){
    if(!me||me.role!=='Employee')return;

  };
  // Make the Employee monthly section easier to read and calculate efficiency correctly.
  window.monthlyEmployeeSummary=function(){
    let d=new Date(),from=new Date(d.getFullYear(),d.getMonth(),1).getTime(),to=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();
    let ideal=(state.assign||[]).filter(a=>a.emp===me.id&&!a.cancelled&&(a.assignedAt||0)>=from&&(a.assignedAt||0)<to).reduce((x,a)=>x+a.suggested,0);

    return '<div class="card month-summary employee-dashboard-card v28-month"><div class="employee-section-title"><h3>📅 This Month</h3><span class="pill">Live</span></div><p class="muted">'+d.toLocaleString(undefined,{month:'long',year:'numeric'})+'</p><div class="employee-month-grid">'+
      '<div class="employee-month-kpi kpi-ideal"><div class="kpi-label">Total Ideal Time</div><div class="kpi-value" id="monthIdeal">'+fmt(ideal)+'</div><span class="small">All assigned suggested time</span></div>'+

    const put=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
    put('activeRunningTime',fmt((Date.now()-active.start)/60000));put('currentSuggested',fmt(sg));put('currentActual',fmt(ac));put('currentRemaining',fmt(Math.max(0,sg-ac)));put('currentExceeded',fmt(a?.job===HOLD?0:Math.max(0,ac-sg)));
    const {from,to}=monthBounds(),ms=monthlySuggested(me.id,from,to),ma=monthlyNormalActual(me.id,from,to),ef=completedEfficiencyFinal(me.id,from,to),inc=window.incentiveFor(me.id),ideal=monthlyIdeal(me.id,from,to),ot=monthlyOvertime(me.id,from,to);
    put('monthTotalSuggestedTime',fmt(ms));put('monthTotalActualTime',fmt(ma));put('monthRemainingSuggestedTime',fmt(Math.max(0,ms-ma)));put('monthEfficiencyPercentage',ef.efficiency==null?'—':ef.efficiency.toFixed(1)+'%');put('monthTotalIncentiveHours',fmt(inc.incentive));put('monthTotalIdealTime',fmt(ideal));put('monthTotalOvertimeHours',fmt(ot));if(typeof window.monthlyRepeatJobHours==='function')put('monthTotalRepeatJobHours',fmt(window.monthlyRepeatJobHours(me.id,from,to)));
  };

  const priorRenderSupervisor=window.renderSupervisor;
  window.renderSupervisor=function(){
    window.v38CheckID001();
    priorRenderSupervisor();
    const root=document.getElementById('supervisorView');if(!root||!me)return;
    const notice=notificationHTML(me.id);if(notice)root.insertAdjacentHTML('afterbegin',notice);
    // Replace the old embedded Assigned list with one reliable whole-card click target.
    const assignedCard=[...root.querySelectorAll('.card')].find(c=>{const h=c.querySelector('h3');return h&&(h.textContent||'').trim().toUpperCase()==='ASSIGNED JOB CARDS';});
    if(assignedCard){const count=openAssignments().length;assignedCard.classList.add('clickable');assignedCard.style.cursor='pointer';assignedCard.innerHTML='<h3>📋 Assigned Job Cards</h3><div class="stat">'+count+'</div><p class="muted">Click anywhere here to open all Not Started, Working, Paused, Repeat Work and ID001 assignments.</p>';assignedCard.onclick=()=>window.openSupervisorAssignedWindow();}
  };

  // Normal actual only for labour cost; overtime is excluded.
  window.labourCost=a=>normalForAssignment(a)*LABOUR_RATE/60;

  // ID001 is a reusable system card and is never non-productive/hidden from monthly suggested totals.
  let h=job(HOLD);if(!h){state.jobs.push({no:HOLD,vehicle:'Ideal Time Card',reg:'0000',status:'Open',systemCard:true,createdBy:'SYSTEM',createdAt:Date.now()});save();}else{h.vehicle='Ideal Time Card';h.reg='0000';h.systemCard=true;delete h.nonProductive;save();}

  window.v38Ready=true;
})();
</script>
