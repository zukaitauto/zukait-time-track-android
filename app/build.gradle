plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zukait.timetrack'
    compileSdk 35

    // Browser VIN OCR uses LSTM mode (OEM 1). Keep both SIMD and non-SIMD
    // LSTM cores, worker and English data. Exclude only unused legacy
    // non-LSTM cores from Android; web-hosted files remain unchanged.
    androidResources {
        ignoreAssetsPatterns.addAll([
            'tesseract-core.wasm.js',
            'tesseract-core-simd.wasm.js'
        ])
    }

    defaultConfig {
        applicationId 'com.zukait.timetrack'
        minSdk 24
        targetSdk 35
        // V351: Verify visible receipt recovery actions and explicit Pause / Finished corrections.
        // Manager worked hours use the Saturday–Thursday workshop week in Oman.
        versionCode 362
        versionName "V399" // Owner-requested full-screen WIP, Manager UI, Supervisor menu, Consumables correction test candidate.
        // V396 final acceptance source: modern Mechanical dashboard, source-pinned web/APK, unchanged secure Mechanical, Reception and financial APIs.
        // V395 exact-source verification: concise Profit/Loss UI, unchanged Accountant backend and release gate.
        // V394 acceptance source: verified 320–1280px Accounts layout, current notification cache and protected API cost checks.
        // V393: dedicated Accountant UI/Profit toggle candidate; release only after coordinated backend checks.
        // V393 exact-source Acceptance: Accounts reports + financial popup + hours/minutes.
        // Browser acceptance re-run with package-mirror-independent Playwright setup.
        // WebKit verified in supported container; Android and financial runtime unchanged.
        // V393 protected Acceptance: all Reception browser tests use isolated Playwright image.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
}


dependencies {
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-intents:3.6.1"
    implementation "androidx.webkit:webkit:1.17.0"
    implementation "androidx.core:core:1.15.0"
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
    implementation "com.google.mlkit:text-recognition:16.0.1"
}


