name: Consumables Stock live-data release safety

on:
  push:
    branches: [architecture-v2]
    paths:
      - 'app/src/main/assets/consumables_stock_ui.js'
      - 'app/src/main/assets/offline_test.html'
      - 'supabase/staged/CONSUMABLES_STOCK_*.sql'
      - 'supabase/functions/workshop-api/extensions/consumables_stock_api.js'
      - 'tests/consumables-stock-*.mjs'
      - 'tests/accountant-stock-workspace.mjs'
      - 'tests/account-session-isolation.mjs'
      - 'tests/consumables-invoice-price-reconcile-client.mjs'
      - 'app/src/main/assets/accountant_stock.js'
      - 'app/src/main/assets/session_privacy.js'
      - 'release-request.json'
      - 'package.json'
      - 'tests/consumables-main-app-preview.mjs'
      - 'scripts/prepare-consumables-stock-android-pilot.mjs'
      - '.github/workflows/stock-live-data-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-offline-db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies (no scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full isolated PG17-compatible stock ledger checks
        run: npm run test:consumables:stock
      - name: Verify account-scoped transaction recovery
        run: |
          node tests/consumables-stock-retry-safety.mjs
          node tests/account-session-isolation.mjs
          node tests/accountant-stock-workspace.mjs
          node tests/consumables-invoice-price-reconcile-client.mjs
          node tests/consumables-invoice-price-client.mjs
          node tests/consumables-purchase-role-recovery.mjs
      - name: Normal staff app cannot activate via URL
        run: node tests/consumables-stock-live-readiness.mjs
      - name: Confirm live Stock activation remains disabled
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const request=JSON.parse(fs.readFileSync('release-request.json','utf8'));
          // V409 may be published for UI acceptance. That is NOT permission
          // to install stock tables, deploy Stock API, or activate writes.
          const uiOnly=request.releaseScope==='phase1-compatible-ui' &&
            request.productionBackendChanges===false && request.backendDeploymentRequired===false;
          // The V420 candidate requires a backend migration but remains unapproved.
          // This check permits preparation only, not activation or publication.
          const heldPurchase=request.releaseScope==='purchase-invoice-coordinated' &&
            request.versionName==='V420' && request.versionCode===383 &&
            request.approvedForStaff===false && request.productionBackendChanges===true &&
            request.backendDeploymentRequired===true && request.approvedAt===null &&
            request.publishNonce===null;
          const heldParity=request.releaseScope==='standard' && request.versionName==='V422' && request.versionCode===385 && request.approvedForStaff===false && request.approvedAt===null && request.publishNonce===null && request.productionBackendChanges===true && request.backendDeploymentRequired===true;
          // V424 is a held, UI-only Consumables menu/list update, with no backend changes.
          const heldV424=request.releaseScope==='standard' && request.versionName==='V424' &&
            request.versionCode===387 && request.approvedForStaff===false && request.approvedAt===null &&
            request.publishNonce===null && request.productionBackendChanges===false && request.backendDeploymentRequired===false;
          const heldV425=request.releaseScope==='standard' && request.versionName==='V425' &&
            request.versionCode===388 && request.approvedForStaff===false && request.approvedAt===null &&
            request.publishNonce===null && request.productionBackendChanges===false && request.backendDeploymentRequired===false;
          // V426 adds only audited vehicle movement functionality; no Stock activation.
          const heldV426=request.releaseScope==='standard' && request.versionName==='V426' &&
            request.versionCode===389 && request.approvedForStaff===false && request.approvedAt===null &&
            request.publishNonce===null && request.productionBackendChanges===true && request.backendDeploymentRequired===true;
          if(request.phase2ActivationApproved!==false || (!uiOnly && !heldPurchase && !heldParity && !heldV424 && !heldV425 && !heldV426))
            throw Error('Unexpected Stock backend activation or release scope');
          const html=fs.readFileSync('app/src/main/assets/offline_test.html','utf8');
          if(!html.includes('window.ZUKAIT_STOCK_UI_PREVIEW_ONLY=true'))
            throw Error('Stock preview safety missing from normal app');
          console.log('PASS: UI-only or explicitly unapproved release preparation; stock activation is not approved.');
          NODE
