name: Reception verification
on:
  push:
    branches: [architecture-v2]
    paths:
      - "app/src/main/assets/v2/features/insurance/**"
      - "supabase/functions/workshop-api/**"
      - "supabase/functions/staff-auth/**"
      - "supabase/migrations/**"
      - "app/src/main/assets/reception_dashboard.js"
      - "app/src/main/assets/receptionist*"
      - "app/src/main/assets/secure_auth.js"
      - "app/src/main/assets/offline_test.html"
      - "tests/reception-*"
      - "scripts/verify-coordinated-release.cjs"
      - "scripts/verify-ui-only-release.cjs"
      - "scripts/verify-pc-pages-publication.cjs"
      - ".github/workflows/publish-approved-release.yml"
      - ".github/workflows/pages.yml"
      - "tests/fixtures/reception-*"
      - "package*.json"
      - "scripts/prepare-insurance-acceptance.py"
      - ".github/workflows/reception-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: reception-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 tests/reception-acceptance-preparation.py
      - run: npm run test:reception
      - run: node tests/reception-user-work-type.mjs
      - name: Isolated PostgreSQL concurrent-device acceptance
        run: npm run test:reception:concurrency
        env:
          ZUKAIT_RECEPTION_ISOLATED: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGPASSWORD: reception-test-only
          ZUKAIT_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: node tests/reception-api.mjs
      - run: node tests/reception-isolated-transport-selftest.mjs
      - run: node tests/reception-isolated-recovery-selftest.mjs
      - run: node tests/reception-isolated-delivery-selftest.mjs
      - run: node tests/reception-ui-only-release.mjs
      - run: node tests/reception-coordinated-release.mjs
      - run: node tests/reception-pages-publication-safety.mjs
      - run: python3 scripts/verify-reception-platform-assets.py
      - run: node tests/reception-v305-acceptance.mjs
      - run: node tests/reception-backup-export-safety.mjs
      - run: node tests/reception-release-publish-safety.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:reception:browser
      - run: bash scripts/ci-validate-js.sh


  dispatch_approved_v307:
    name: One-time owner-approved V307 release dispatch
    # Verify the original pinned candidate and let the protected publisher run its own gates.
    # The pending V307 approval intentionally differs from live V306 until publication.
    # Only an explicit owner-authorized one-time push can dispatch a release.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/architecture-v2' &&
      github.event.head_commit.message == 'Owner-authorized one-time V307 dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Require pinned owner approval and successful V307 candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/architecture-v2"
          jq -e --arg source "c044f201b0303e8b6b25fd819303ceb83aef9334" '
            .versionName == "V307" and .versionCode == 270 and
            .sourceCommit == $source and .approvedForStaff == true and
            .releaseScope == "phase1-compatible-ui" and
            .productionBackendChanges == false and
            .phase2ActivationApproved == false and
            .physicalAcceptanceStatus == "NOT_RUN" and
            .signedAcceptanceRun == 38067144236 and
            .verificationRun == 38067144278
          ' release-ui-request.json
          jq -e '.versionName == "V307" and .versionCode == 270 and .approvedForStaff == false' release-request.json
          jq -e '.versionName == "V306" and .versionCode == 269' latest-version.json
          for run in 38067144236 38067144278; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -e \
              --arg source "c044f201b0303e8b6b25fd819303ceb83aef9334" \
              '.head_sha == $source and .head_branch == "architecture-v2" and .conclusion == "success"'
          done
      - name: Dispatch protected coordinated publisher on architecture-v2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-approved-release.yml/dispatches" \
            --raw-field ref=architecture-v2
          echo "Dispatched protected V307 publishing workflow on architecture-v2"
