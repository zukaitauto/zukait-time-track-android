name: Reception verification
# Re-run isolated concurrent-save and history-preservation acceptance for V318.
# V318: revalidate Reception and signed candidate together after staging and evidence updates.
on:
  push:
    branches: [architecture-v2]
    paths:
      - "app/build.gradle"
      - "app/src/main/assets/v2/features/estimate/**"
      - "tests/v2-estimate-*"
      - "tests/reception-pages-publication-safety.mjs"
      - "release-request.json"
      - "app/src/main/assets/v2/features/insurance/**"
      - "supabase/functions/workshop-api/**"
      - "supabase/functions/staff-auth/**"
      - "supabase/migrations/**"
      - "app/src/main/assets/reception_dashboard.js"
      - "app/src/main/assets/insurance_management.js"
      - "tests/insurance-job-list-layout.mjs"
      - "tests/insurance-management.mjs"
      - "app/src/main/assets/job_card_edit.js"
      - "app/src/main/assets/manager_job_edit.js"
      - "app/src/main/assets/supervisor_stable.js"
      - "app/src/main/assets/receptionist*"
      - "app/src/main/assets/secure_auth.js"
      - "app/src/main/assets/offline_test.html"
      - "tests/reception-*"
      - "tests/workshop-history-preservation.mjs"
      - "tests/release-tier.mjs"
      - "scripts/release-tier.cjs"
      - "scripts/verify-management-release.cjs"
      - "tests/management-release-deferral.mjs"
      - "scripts/verify-coordinated-release.cjs"
      - "scripts/verify-ui-only-release.cjs"
      - "scripts/verify-pc-pages-publication.cjs"
      - ".github/workflows/publish-approved-release.yml"
      - ".github/workflows/pages.yml"
      - "tests/fixtures/reception-*"
      - "package*.json"
      - "scripts/prepare-insurance-acceptance.py"
      - ".github/workflows/reception-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: reception-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 tests/reception-acceptance-preparation.py
      - run: npm run test:reception
      - run: npm run test:management
      - name: Verify compact Insurance Job Cards and dedicated detail view
        run: node tests/insurance-job-list-layout.mjs
      - name: Verify approved 37-row Consumables PDF master
        run: npm run test:consumables:pdf
      - name: Prevent stale full-state saves from erasing workshop history
        run: node tests/workshop-history-preservation.mjs
      - name: Verify safe advisory release classification
        run: node tests/release-tier.mjs
      - name: Verify explicit backup deferral preserves release gates
        run: node tests/management-release-deferral.mjs
      - run: node tests/reception-user-work-type.mjs
      - name: Isolated PostgreSQL concurrent-device acceptance
        run: npm run test:reception:concurrency
        env:
          ZUKAIT_RECEPTION_ISOLATED: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGPASSWORD: reception-test-only
          ZUKAIT_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: node tests/reception-api.mjs
      - run: node tests/reception-isolated-transport-selftest.mjs
      - run: node tests/reception-isolated-recovery-selftest.mjs
      - run: node tests/reception-isolated-delivery-selftest.mjs
      - run: node tests/reception-ui-only-release.mjs
      - run: node tests/reception-coordinated-release.mjs
      - run: node tests/reception-pages-publication-safety.mjs
      - run: python3 scripts/verify-reception-platform-assets.py
      - run: node tests/reception-v305-acceptance.mjs
      - run: node tests/reception-backup-export-safety.mjs
      - run: node tests/reception-release-publish-safety.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:reception:browser
      - name: Verify approved one-page A4 Reception PDF in Chromium
        run: node tests/reception-print-a4.mjs
      - name: Preserve A4 print preview for workshop review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reception-a4-print-preview-${{ github.run_id }}
          path: artifacts/reception-a4/
          if-no-files-found: warn
          retention-days: 30
      - run: bash scripts/ci-validate-js.sh

  dispatch_pinned_v308:
    name: One-time dispatch of owner-approved pinned V308 release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/architecture-v2' &&
      github.event.head_commit.message == 'Owner-approved one-time V308 dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify owner-approved A4 V308 source and safe release gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APPROVED_SHA='45c6712460a2d675ac135e4ad440aa820417c15b'
          jq -e --arg sha "$APPROVED_SHA" '
            .approvedForStaff == true and .versionName == "V308" and
            .versionCode == 271 and .sourceCommit == $sha and
            .releaseScope == "phase1-compatible-ui" and
            .productionBackendChanges == false and
            .phase2ActivationApproved == false and
            .physicalAcceptanceStatus == "NOT_RUN" and
            .signedAcceptanceRun == 38082133296 and
            .verificationRun == 38082133292
          ' release-ui-request.json
          jq -e '.approvedForStaff == false and .versionName == "V308" and .versionCode == 271' release-request.json
          PINNED_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/v308-approved-source" --jq '.object.sha')
          test "$PINNED_SHA" = "$APPROVED_SHA"
          for RUN in 38082133296 38082133292; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" | jq -e \
              --arg sha "$APPROVED_SHA" \
              '.conclusion == "success" and .head_sha == $sha and .head_branch == "architecture-v2"'
          done
      - name: Dispatch protected publisher on architecture-v2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-approved-release.yml/dispatches" --raw-field ref=architecture-v2
          echo 'Owner-approved V308 dispatch sent to protected architecture-v2 publisher'

