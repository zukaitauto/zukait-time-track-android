name: Reception verification
on:
  push:
    branches: [architecture-v2]
    paths:
      - "app/src/main/assets/v2/features/insurance/**"
      - "supabase/functions/workshop-api/**"
      - "supabase/functions/staff-auth/**"
      - "supabase/migrations/**"
      - "app/src/main/assets/receptionist*"
      - "app/src/main/assets/secure_auth.js"
      - "app/src/main/assets/offline_test.html"
      - "tests/reception-*"
      - "tests/fixtures/reception-*"
      - "package*.json"
      - "scripts/prepare-insurance-acceptance.py"
      - ".github/workflows/reception-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: reception-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 tests/reception-acceptance-preparation.py
      - run: npm run test:reception
      - name: Isolated PostgreSQL concurrent-device acceptance
        run: npm run test:reception:concurrency
        env:
          ZUKAIT_RECEPTION_ISOLATED: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGPASSWORD: reception-test-only
      - run: node tests/reception-api.mjs
      - run: node tests/reception-isolated-transport-selftest.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:reception:browser
      - run: bash scripts/ci-validate-js.sh

