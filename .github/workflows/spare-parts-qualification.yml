name: Spare Parts V2 Qualification

on:
  pull_request:
    branches: [ architecture-v2 ]
    paths:
      - 'app/src/main/assets/v2/features/spare-parts/**'
      - 'tests/v2-spare-parts*.mjs'
      - '.github/workflows/spare-parts-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Spare Parts module
        run: |
          set -e
          for f in app/src/main/assets/v2/features/spare-parts/*.js; do node --check "$f"; done
      - name: Run Spare Parts V2 tests
        run: |
          set -e
          for t in tests/v2-spare-parts*.mjs; do echo "==> $t"; node "$t"; done
      - name: Production isolation guard
        run: |
          set -e
          grep -q "productionConnected:false" app/src/main/assets/v2/features/spare-parts/persistence-contract.js
          grep -q "NO_WRITE_UNTIL_ENABLED" app/src/main/assets/v2/features/spare-parts/persistence-contract.js
          grep -q "NO_PRODUCTION_PUSH_UNTIL_ENABLED" app/src/main/assets/v2/features/spare-parts/persistence-contract.js
