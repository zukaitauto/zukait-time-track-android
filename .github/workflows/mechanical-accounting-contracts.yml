name: Inactive Mechanical and Accountant contracts
on:
  push:
    branches: [feature/mechanical-accounting-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/mechanical-accounting-contracts.mjs
