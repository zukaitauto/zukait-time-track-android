name: V401 exact-v124 VIN and Mechanical Inspection compatibility
on:
  workflow_dispatch:
  push:
    branches: [architecture-v2]
    paths:
      - 'releases/v401-v124-compat/**'
      - 'scripts/verify-v401-v124-compat.cjs'
      - '.github/workflows/v401-v124-compat.yml'

permissions:
  contents: read

jobs:
  v124-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify exact live v124 source is unchanged outside scoped routes
        run: node scripts/verify-v401-v124-compat.cjs
      - name: Stage isolated exact-v124 compatible entrypoint
        run: cp releases/v401-v124-compat/workshop-api/index.ts supabase/functions/workshop-api/index.ts
      - name: Parse TypeScript endpoint and all imported Mechanical Inspection modules
        run: |
          deno fmt - < supabase/functions/workshop-api/index.ts > /dev/null
          for f in supabase/functions/workshop-api/extensions/mechanical_inspection_*.js; do
            deno fmt - < "$f" > /dev/null
          done
      - name: Run isolated Mechanical Inspection security and adapter tests
        run: |
          node tests/mechanical-inspection-contract.mjs
          node tests/mechanical-inspection-api.mjs
          node tests/mechanical-inspection-boundary.mjs
          node tests/mechanical-inspection-session.mjs
          node tests/mechanical-inspection-storage.mjs
          node tests/mechanical-inspection-read-adapter.mjs
          node tests/mechanical-inspection-save-adapter.mjs
      - name: Install browser-test dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Verify VIN safety and Reception API contracts
        run: |
          node tests/vehicle-global-identity.mjs
          node tests/reception-vehicle-authority.mjs
          node tests/reception-job-edit.mjs
      - name: Live v125 endpoint deployment smoke — invalid sessions must fail closed
        run: |
          set -euo pipefail
          BASE='https://pjknotnjkufadqavcmii.supabase.co/functions/v1/workshop-api'
          KEY='sb_publishable_-sg597IpB0MLIHdDoedRIA_MTt0Sa9A'
          for action in vehicle_master_candidates vehicle_master_verify mechanical_inspection; do
            case "$action" in
              vehicle_master_candidates) BODY='{"action":"vehicle_master_candidates","registration":"32621-M"}' ;;
              vehicle_master_verify) BODY='{"action":"vehicle_master_verify","registration":"32621-M","vehicle_id":"00000000-0000-4000-8000-000000000000","vin":"WVWZZZ1JZXW000001"}' ;;
              mechanical_inspection) BODY='{"action":"mechanical_inspection","command":{"operation":"READ_INSPECTION","checklistId":"00000000-0000-4000-8000-000000000000"}}' ;;
            esac
            STATUS=$(curl --silent --show-error --max-time 25 --output /tmp/v401-endpoint-denied.json --write-out '%{http_code}' \
              --request POST --header 'Content-Type: application/json' \
              --header "apikey: $KEY" --header 'x-zukait-session: NONEXISTENT_V401_ENDPOINT_TEST' \
              --data "$BODY" "$BASE")
            test "$STATUS" = 401 || { echo "::error::$action unexpected unauthenticated status $STATUS"; cat /tmp/v401-endpoint-denied.json; exit 1; }
          done
