name: Build V56 Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check app/src/main/assets/cloud_sync.js
          node --check app/src/main/assets/secure_auth.js
          node --check app/src/main/assets/production_pilot.js
          node --check app/src/main/assets/professional_ux.js
          node --check app/src/main/assets/v54_improvements.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/offline_test.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          out = Path('/tmp/zukait-inline-js')
          out.mkdir(parents=True, exist_ok=True)
          for i, script in enumerate(scripts):
              (out / f'inline_{i:02d}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(scripts)} inline script blocks')
          PY
          for f in /tmp/zukait-inline-js/*.js; do
            node --check "$f"
          done

      - name: Check production assets
        shell: bash
        run: |
          test -s app/src/main/assets/zukait_logo.webp
          test -s app/src/main/assets/professional_ux.js
          test -s app/src/main/assets/v54_improvements.js
          test -s app/src/main/res/drawable/app_icon.webp
          test -s app/src/main/res/drawable/app_logo.webp
          test -s app/src/main/res/drawable/splash_screen.xml
          test -s app/src/main/res/values/styles.xml

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Sign V56 APK with permanent key
        shell: bash
        env:
          ZUKAIT_KEYSTORE_BASE64: ${{ secrets.ZUKAIT_KEYSTORE_BASE64 }}
          ZUKAIT_KEYSTORE_PASSWORD: ${{ secrets.ZUKAIT_KEYSTORE_PASSWORD }}
          ZUKAIT_KEY_ALIAS: ${{ secrets.ZUKAIT_KEY_ALIAS }}
          ZUKAIT_KEY_PASSWORD: ${{ secrets.ZUKAIT_KEY_PASSWORD }}
        run: |
          test -n "$ZUKAIT_KEYSTORE_BASE64" || { echo "Missing ZUKAIT_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$ZUKAIT_KEYSTORE_PASSWORD" || { echo "Missing ZUKAIT_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$ZUKAIT_KEY_ALIAS" || { echo "Missing ZUKAIT_KEY_ALIAS repository secret"; exit 1; }
          test -n "$ZUKAIT_KEY_PASSWORD" || { echo "Missing ZUKAIT_KEY_PASSWORD repository secret"; exit 1; }
          printf '%s' "$ZUKAIT_KEYSTORE_BASE64" | base64 --decode > /tmp/zukait-release.jks
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/ZUKAIT_TIME_TRACK_V56_ALIGNED.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/zukait-release.jks \
            --ks-key-alias "$ZUKAIT_KEY_ALIAS" \
            --ks-pass "pass:$ZUKAIT_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ZUKAIT_KEY_PASSWORD" \
            --out ZUKAIT_TIME_TRACK_V56_SIGNED_RELEASE.apk \
            /tmp/ZUKAIT_TIME_TRACK_V56_ALIGNED.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs ZUKAIT_TIME_TRACK_V56_SIGNED_RELEASE.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZUKAIT_TIME_TRACK_V56_SIGNED_RELEASE
          path: ZUKAIT_TIME_TRACK_V56_SIGNED_RELEASE.apk
          if-no-files-found: error

      - name: Prepare Android signing tools
        shell: bash
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: ANDROID_SIGNING_TOOLS_35
          path: signing-tools
