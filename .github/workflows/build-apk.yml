name: Build Zukait Time Track APK

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/painting-consumables-v1, architecture-v2 ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check app/src/main/assets/cloud_sync.js
          node --check app/src/main/assets/consumables.js
          node --check app/src/main/assets/consumables_ui.js
          node --check app/src/main/assets/paint_module.js
          node --check app/src/main/assets/secure_auth.js
          node --check app/src/main/assets/production_pilot.js
          node --check app/src/main/assets/professional_ux.js
          node --check app/src/main/assets/v54_improvements.js
          node --check app/src/main/assets/v63_updates.js
          node --check app/src/main/assets/v65_updates.js
          node --check app/src/main/assets/v66_updates.js
          node --check app/src/main/assets/v67_updates.js
          node --check app/src/main/assets/v68_updates.js
          node --check app/src/main/assets/v69_updates.js
          node --check app/src/main/assets/v74_updates.js
          node --check app/src/main/assets/supervisor_stable.js
          node --check app/src/main/assets/live_status_authority.js
          node --check app/src/main/assets/job_cost_summary_v128.js
          node --check app/src/main/assets/v2/core/event_contract.js
          node --check app/src/main/assets/v2/core/live_selectors.js
          node --check app/src/main/assets/v2/core/offline_queue.js
          node --check app/src/main/assets/v2/core/event_parity.js
          node --check app/src/main/assets/v2/core/reconnect_authority.js
          node --check app/src/main/assets/v2/core/reconnect_shadow_audit.js
          node --check app/src/main/assets/v2/core/authority_adapter.js
          node --check app/src/main/assets/v2/core/reconcile_runtime.js
          node --check app/src/main/assets/v2/core/pilot_activation.js
          node --check app/src/main/assets/v2/core/data_paths.js
          node --check app/src/main/assets/v2/features/jobcards/workflow.js
          node --check app/src/main/assets/v2/features/spare-parts/workflow.js
          node --check app/src/main/assets/v2/features/notifications/rules.js
          node --check app/src/main/assets/v2/features/reports/service.js
          node --check app/src/main/assets/v2/features/time/work_rules.js
          node --check app/src/main/assets/v2/features/time/work_events.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/offline_test.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          out = Path('/tmp/zukait-inline-js')
          out.mkdir(parents=True, exist_ok=True)
          for i, script in enumerate(scripts):
              (out / f'inline_{i:02d}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(scripts)} inline script blocks')
          PY
          for f in /tmp/zukait-inline-js/*.js; do
            node --check "$f"
          done

      - name: Run functional smoke tests
        run: |
          node tests/functional-smoke.mjs
          node tests/consumables-smoke.mjs
          node tests/consumables-ui.mjs
          node tests/assignment-search-ui.mjs
          node tests/supervisor-stable-ui.mjs
          node tests/live-status-authority.mjs
          node tests/consumables-backend-security.mjs
          node tests/v128-costing-safety.mjs
          node tests/paint-safety.mjs
          node tests/vehicle-logo-assets.mjs
          node tests/architecture-v2.mjs
          node tests/v2-work-events.mjs
          node tests/v2-reconnect-authority.mjs
          node tests/v2-reconnect-shadow-readonly.mjs
          node tests/v2-authority-adapter.mjs
          node tests/v2-reconcile-runtime.mjs
          node tests/v2-pilot-activation.mjs
          node tests/v2-work-rules.mjs
          node tests/v2-data-paths.mjs
          node tests/v2-server-data-adapter.mjs
          node tests/v2-report-server-adapter.mjs
          node tests/v2-event-write-idempotency.mjs
          node tests/v2-api-single-authority.mjs
          node tests/v2-sql-migration-integrity.mjs
          node tests/v2-sql-delimiters.mjs
          node tests/v2-server-calendar-leave-authority.mjs
          node tests/v2-leave-projection-authority.mjs
          node tests/v2-calendar-projection-authority.mjs
          node tests/v2-one-active-session-authority.mjs
          node tests/v2-id001-auto-stop-authority.mjs
          node tests/v2-assignment-authority.mjs
          node tests/v2-delayed-replay-authority.mjs
          node tests/v2-queue-conflict-quarantine.mjs
          node tests/v2-conflict-visibility.mjs
          node tests/v2-conflict-resolution-lifecycle.mjs
          node tests/v2-bounded-pagination-cursors.mjs
          node tests/v2-repeat-consumables-server-authority.mjs
          node tests/v2-spare-parts-server-authority.mjs
          node tests/v2-multidevice-conflict-matrix.mjs
          node tests/v2-same-employee-device-race.mjs
          node tests/v2-jobcard-projection.mjs
          node tests/v2-wip-completion-target.mjs
          node tests/v2-jobcard-projection-conflicts.mjs
          node tests/v2-jobcard-event-projection.mjs
          node tests/v2-work-session-projection.mjs
          node tests/v2-job-workflow.mjs
          node tests/v2-spare-parts.mjs
          node tests/v2-repeat-work.mjs
          node tests/v2-leave.mjs
          node tests/v2-consumables.mjs
          node tests/v2-notification-rules.mjs
          node tests/v2-reports.mjs
          node tests/v2-scale-benchmark.mjs
          node tests/v2-migration-completeness.mjs
          node tests/v2-production-isolation.mjs
          node tests/v2-full-regression-manifest.mjs

      - name: Check production assets
        shell: bash
        run: |
          test -s app/src/main/assets/zukait_logo.webp
          test -s app/src/main/assets/consumables.js
          test -s app/src/main/assets/consumables_ui.js
          test -s app/src/main/assets/professional_ux.js
          test -s app/src/main/assets/v54_improvements.js
          test -s app/src/main/assets/v65_updates.js
          test -s app/src/main/assets/v66_updates.js
          test -s app/src/main/assets/v67_updates.js
          test -s app/src/main/assets/v68_updates.js
          test -s app/src/main/assets/v69_updates.js
          test -s app/src/main/assets/v74_updates.js
          test -s app/src/main/assets/supervisor_stable.js
          test -s app/src/main/assets/live_status_authority.js
          test -s app/src/main/assets/job_cost_summary_v128.js
          test -s app/src/main/res/drawable/app_icon.webp
          test -s app/src/main/res/drawable/app_logo.webp
          test -s app/src/main/res/drawable/splash_screen.xml
          test -s app/src/main/res/values/styles.xml

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename unsigned APK
        shell: bash
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk ZUKAIT_TIME_TRACK_UNSIGNED_RELEASE.apk

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZUKAIT_TIME_TRACK_UNSIGNED_RELEASE
          path: ZUKAIT_TIME_TRACK_UNSIGNED_RELEASE.apk
          if-no-files-found: error

      - name: Prepare Android signing tools
        shell: bash
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: ANDROID_SIGNING_TOOLS_35
          path: signing-tools
