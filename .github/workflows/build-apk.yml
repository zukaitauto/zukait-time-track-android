name: Build V41 Individual Password Test APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check app/src/main/assets/cloud_sync.js
          node --check app/src/main/assets/secure_auth.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/offline_test.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          out = Path('/tmp/zukait-inline-js')
          out.mkdir(parents=True, exist_ok=True)
          for i, script in enumerate(scripts):
              (out / f'inline_{i:02d}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(scripts)} inline script blocks')
          PY
          for f in /tmp/zukait-inline-js/*.js; do
            node --check "$f"
          done

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ZUKAIT_TIME_TRACK_V41_INDIVIDUAL_PASSWORD_TEST.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZUKAIT_TIME_TRACK_V41_INDIVIDUAL_PASSWORD_TEST
          path: ZUKAIT_TIME_TRACK_V41_INDIVIDUAL_PASSWORD_TEST.apk
