name: Isolated native live-status performance
on:
  push:
    branches: [perf/live-status-session-partition]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: traffic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGPASSWORD: traffic-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --include=dev
      - name: Generate migration using the Supabase CLI
        run: |
          npx --yes supabase@2.81.3 --help
          npx --yes supabase@2.81.3 migration new --help
          npx --yes supabase@2.81.3 migration new optimize_live_status_session_partition
          MIGRATION_PATH=$(find supabase/migrations -name '*_optimize_live_status_session_partition.sql')
          test -n "$MIGRATION_PATH"
          cp experiments/live-status-session-partition.sql "$MIGRATION_PATH"
          echo "GENERATED_MIGRATION_PATH=$MIGRATION_PATH"
      - name: Existing native save, reception and delivery concurrency acceptance
        run: node tests/reception-concurrency.mjs
        env:
          ZUKAIT_RECEPTION_ISOLATED: '1'
      - name: Native performance, exact output parity and full-save acceptance
        run: node tests/live-status-native-acceptance.mjs
        env:
          ZUKAIT_TRAFFIC_ISOLATED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-live-status-performance
          path: |
            artifacts/traffic-performance/
            supabase/migrations/*_optimize_live_status_session_partition.sql
          retention-days: 14
