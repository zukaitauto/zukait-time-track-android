name: Five-minute live dashboard stability
on:
  pull_request:
    paths:
      - 'app/src/main/assets/cash_monthly_pulse.js'
      - 'app/src/main/assets/workshop_overview.js'
      - 'app/src/main/assets/cloud_sync.js'
      - 'tests/dashboard-live-stability.mjs'
      - '.github/workflows/dashboard-live-stability.yml'
permissions:
  contents: read
jobs:
  stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/cash-monthly-pulse.mjs && node tests/shared-dashboard-read.mjs && node tests/manager-overdue-time-review.cjs && node --experimental-vm-modules tests/sync-traffic-compatibility.mjs
      - run: node tests/monthly-followup-responsive.mjs
      - run: node tests/dashboard-live-stability.mjs
