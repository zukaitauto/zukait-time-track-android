name: V415 Stock integrity review (isolated, read-only)
on:
  pull_request:
    branches: [architecture-v2]
    paths:
      - 'app/src/main/assets/consumables_stock_ui.js'
      - 'supabase/staged/CONSUMABLES_STOCK_*.sql'
      - 'supabase/functions/workshop-api/extensions/consumables_stock_api.js'
      - 'tests/consumables-stock-*.mjs'
      - '.github/workflows/stock-integrity-pr-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Stock browser script syntax
        run: node --check app/src/main/assets/consumables_stock_ui.js
      - name: Test isolated Stock lifecycle, schema, master overlay and roles
        run: npm run test:consumables:stock
      - name: Ensure normal workshop build cannot enable Stock by URL
        run: node tests/consumables-stock-live-readiness.mjs

  reception-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Reception and saved Job Card workflows
        run: npm run test:reception && node tests/reception-api.mjs
      - name: Verify Paint Consumables save/reopen and sync
        run: node tests/consumables-ui.mjs && node tests/cloud-sync-recovery.mjs
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application scripts
        run: bash scripts/ci-validate-js.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build PR-only debug Android APK (no release signing)
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZUKAIT-V415-STOCK-PR-DEBUG-DO-NOT-PUBLISH
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
