name: Job Card A4 document view
on:
  pull_request:
    paths:
      - 'app/src/main/assets/job_card_edit.js'
      - 'app/src/main/assets/manager_job_edit.js'
      - 'app/src/main/assets/reception_dashboard.js'
      - 'supabase/functions/workshop-api/job_edit_rules.js'
      - 'supabase/staged/MANAGER_JOB_LOCATION_DATE.sql'
      - 'tests/job-vehicle-location.mjs'
      - 'tests/reception-dashboard-client.mjs'
      - 'tests/reception-receptionist-api.mjs'
      - 'supabase/staged/CUSTOMER_VISIT_DIRECTORY_V427.sql'
      - 'tests/job-card-a4-view.mjs'
      - '.github/workflows/job-card-a4-view.yml'
permissions:
  contents: read
jobs:
  document-view:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/job-card-a4-view.mjs
      - run: node tests/reception-job-edit.mjs
      - run: node tests/job-vehicle-location.mjs
      - run: node tests/reception-dashboard-client.mjs
      - run: node tests/reception-receptionist-api.mjs
