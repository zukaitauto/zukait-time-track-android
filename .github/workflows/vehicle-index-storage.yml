name: Vehicle Index isolated PostgreSQL verification
on:
  pull_request:
    branches: [architecture-v2]
    paths:
      - 'docs/vehicle-index-storage-review.sql'
      - 'tests/vehicle-index-storage.sql'
      - '.github/workflows/vehicle-index-storage.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: vehicle_index_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated catalogue SQL
        env:
          PGPASSWORD: disposable-ci-password
        run: psql -X -h 127.0.0.1 -U postgres -d vehicle_index_test -v ON_ERROR_STOP=1 -f tests/vehicle-index-storage.sql
