name: Prepare isolated insurance acceptance
on:
  workflow_dispatch:
  push:
    branches:
      - architecture-v2
    paths:
      - .github/workflows/insurance-isolated-acceptance.yml
      - app/src/main/assets/v2/features/insurance/reception.js
      - app/src/main/assets/reception_dashboard.js
      - app/src/main/assets/receptionist.html
      - supabase/functions/workshop-api/reception_dashboard_rules.js
      - app/src/main/assets/secure_auth.js
      - app/src/main/assets/receptionist_session.js
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/architecture-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public QA-only publishable key; no secret or production service-role key.
      ZUKAIT_ACCEPTANCE_PROJECT_REF: omqgkqknbdcnotabffek
      ZUKAIT_ACCEPTANCE_PUBLISHABLE_KEY: sb_publishable_DBp6FI8Z4ThAq_4LXrZXSg_Xw2uPPgO
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify isolation preparation
        run: python3 tests/reception-acceptance-preparation.py
      - name: Prepare separate client source
        run: python3 scripts/prepare-insurance-acceptance.py --output "$RUNNER_TEMP/insurance-acceptance"
      - name: Verify current V305 Reception UI and QA-only package
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"insurance-acceptance"
          manifest=json.loads((root/"acceptance-manifest.json").read_text())
          assert manifest["source_sha"]==os.environ["GITHUB_SHA"]
          assert manifest["project_ref"]=="omqgkqknbdcnotabffek"
          assert manifest["application_id"]=="com.zukait.timetrack.acceptance"
          assert manifest["updater_disabled"] is True
          assert len(manifest["ordered_pending_migrations"])==9
          assets=root/"app/src/main/assets"
          src=(assets/"v2/features/insurance/reception.js").read_text()
          html=(assets/"offline_test.html").read_text()
          assert "305-reception-dashboard-20261010-r2" in html
          assert "supportsPhase2()" in src
          assert "rc-reading" in src
          assert "rc-claim" in src
          assert "pjknotnjkufadqavcmii" not in src
          assert "pjknotnjkufadqavcmii" not in html
          assert "omqgkqknbdcnotabffek.supabase.co" in src
          print("PASS: current Reception controls, complete 9-migration manifest, QA-only isolated client and disabled updater")
          PY
      - name: Check live isolated QA endpoint authorization (no mutations)
        shell: bash
        run: |
          set -euo pipefail
          API="https://${ZUKAIT_ACCEPTANCE_PROJECT_REF}.supabase.co/functions/v1/workshop-api"
          for action in reception_dashboard receptionist_delivery_list; do
            body='{"action":"'"$action"'","section":"checklists","page":0}'
            status="$(curl -sS --connect-timeout 10 --max-time 25 \
              -o /dev/null -w '%{http_code}' \
              -X POST -H "Content-Type: application/json" \
              -H "apikey: ${ZUKAIT_ACCEPTANCE_PUBLISHABLE_KEY}" \
              -H "x-zukait-session: ZQA_NO_SUCH_SESSION" \
              --data "$body" "$API")"
            if [ "$status" != 401 ]; then
              echo "QA preflight failed: $action returned HTTP $status, expected 401"
              exit 1
            fi
            echo "PASS: isolated QA $action refuses unauthenticated request"
          done
          echo 'Verified QA-only client source and read-only HTTPS rejection on the actual isolated QA backend. No authenticated client acceptance or production mutation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build separate debug APK
        working-directory: ${{ runner.temp }}/insurance-acceptance
        run: gradle assembleDebug --stacktrace
      - name: Verify package and archive evidence
        shell: bash
        run: |
          CANDIDATE="$RUNNER_TEMP/insurance-acceptance"
          APK="$CANDIDATE/app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$CANDIDATE/signature.txt"
          "$BT/aapt" dump badging "$APK" > "$CANDIDATE/package.txt"
          grep -q "package: name='com.zukait.timetrack.acceptance'" "$CANDIDATE/package.txt"
          grep -q "versionName='V305-ACCEPTANCE'" "$CANDIDATE/package.txt"
          grep -q "versionCode='268'" "$CANDIDATE/package.txt"
          cd "$CANDIDATE"
          sha256sum app/build/outputs/apk/debug/app-debug.apk > apk-sha256.txt
          echo 'Build preparation only. Backend and physical-device acceptance remain NOT_RUN.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: INSURANCE_ISOLATED_ACCEPTANCE_${{ github.sha }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/insurance-acceptance/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/insurance-acceptance/web/
            ${{ runner.temp }}/insurance-acceptance/acceptance-manifest.json
            ${{ runner.temp }}/insurance-acceptance/apk-sha256.txt
            ${{ runner.temp }}/insurance-acceptance/signature.txt
            ${{ runner.temp }}/insurance-acceptance/package.txt
