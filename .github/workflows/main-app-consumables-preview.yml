name: Main-app Consumables preview-only safety

on:
  pull_request:
    branches: [architecture-v2]
    paths:
      - 'app/src/main/assets/consumables_ui.js'
      - 'app/src/main/assets/consumables_stock_ui.js'
      - 'app/src/main/assets/mechanical_consumables_ui.js'
      - 'app/src/main/assets/offline_test.html'
      - 'tests/consumables-main-app-preview.mjs'
      - '.github/workflows/main-app-consumables-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse original and preview assets
        run: |
          node --check app/src/main/assets/consumables_ui.js
          node --check app/src/main/assets/consumables_stock_ui.js
          node --check app/src/main/assets/mechanical_consumables_ui.js
          node --check app/src/main/assets/cloud_sync.js
      - name: No stock RPC from main-app read-only preview
        run: node tests/consumables-main-app-preview.mjs
      - name: Existing Painting/Consumables regression
        run: node tests/consumables-ui.mjs
      - name: No backend or release source changed by UI preview
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('app/src/main/assets/offline_test.html','utf8');if(!h.includes('ZUKAIT_STOCK_UI_PREVIEW_ONLY=true')||/ZUKAIT_MECHANICAL_STOCK_ENABLED\s*=\s*true/.test(h))process.exit(1)"
