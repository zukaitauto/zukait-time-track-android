name: Mechanical Stock QA deployment
on:
  pull_request:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/mechanical-stock-qa-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mechanical-stock-qa-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'zukaitauto/zukait-time-track-android' && github.ref != 'refs/heads/architecture-v2' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'integration/stock-mechanical-consolidation-20261127'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify QA credential availability
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_QA_ACCESS_TOKEN is not configured"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - name: Package isolated QA endpoint
        run: |
          cp -a supabase/functions/workshop-api supabase/functions/workshop-api-mechanical-stock-qa
      - name: Deploy only to existing QA project
        run: |
          supabase functions deploy workshop-api-mechanical-stock-qa --project-ref omqgkqknbdcnotabffek --no-verify-jwt --use-api
