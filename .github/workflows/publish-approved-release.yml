name: Publish Approved Signed APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Approved version name, e.g. V67
        required: true
      version_code:
        description: Approved Android version code
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4

      - name: Verify requested version matches source
        shell: bash
        run: |
          grep -q "versionName '${{ inputs.version_name }}'" app/build.gradle
          grep -q "versionCode ${{ inputs.version_code }}" app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Restore permanent signing key
        shell: bash
        env:
          ZUKAIT_SIGNING_JKS_BASE64: ${{ secrets.ZUKAIT_SIGNING_JKS_BASE64 }}
        run: |
          test -n "$ZUKAIT_SIGNING_JKS_BASE64"
          printf '%s' "$ZUKAIT_SIGNING_JKS_BASE64" | base64 -d > /tmp/zukait-release.jks

      - name: Sign and verify APK
        shell: bash
        env:
          ZUKAIT_KEY_ALIAS: ${{ secrets.ZUKAIT_KEY_ALIAS }}
          ZUKAIT_STORE_PASSWORD: ${{ secrets.ZUKAIT_STORE_PASSWORD }}
          ZUKAIT_KEY_PASSWORD: ${{ secrets.ZUKAIT_KEY_PASSWORD }}
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign             --ks /tmp/zukait-release.jks             --ks-key-alias "$ZUKAIT_KEY_ALIAS"             --ks-pass env:ZUKAIT_STORE_PASSWORD             --key-pass env:ZUKAIT_KEY_PASSWORD             --out ZUKAIT_TIME_TRACK_LATEST.apk             /tmp/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs ZUKAIT_TIME_TRACK_LATEST.apk

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="release-${{ inputs.version_name }}"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes || true
          git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" ZUKAIT_TIME_TRACK_LATEST.apk             --title "Zukait Time Track ${{ inputs.version_name }}"             --notes "Approved signed production release ${{ inputs.version_name }}."             --latest
