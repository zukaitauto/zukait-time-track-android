name: Publish Approved Signed APK

on:
  # Publishing a staff APK is an explicit action, never a side effect of a
  # release-request edit, QA push, or a commit on main.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/architecture-v2'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      EXPECTED_PACKAGE: com.zukait.timetrack
      EXPECTED_CERT_SHA256: 63886438214503d468f053b44afe34baf008019f674e065a09b14ae8bf451af0
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release credential with workflow-write permission
        shell: bash
        env:
          RELEASE_WORKFLOW_TOKEN: ${{ secrets.ZUKAIT_RELEASE_WORKFLOW_TOKEN }}
        run: |
          if [ -z "$RELEASE_WORKFLOW_TOKEN" ]; then
            echo '::error::V307 publishing is blocked: configure the repository secret ZUKAIT_RELEASE_WORKFLOW_TOKEN with Contents: read/write and Workflows: read/write access to this repository.'
            echo 'The built-in GITHUB_TOKEN cannot create a release targeted at a commit changing .github/workflows versus main (HTTP 403).'
            exit 1
          fi
          echo 'Dedicated release credential is configured. The protected source/approval gates still apply.'

      - name: Resolve explicitly owner-authorized UI-only scope
        run: node scripts/verify-ui-only-release.cjs >> "$GITHUB_ENV"

      - name: Verify approved source commit
        shell: bash
        run: |
          APPROVED=$(jq -r '.approvedForStaff // false' release-request.json)
          SOURCE_COMMIT=$(jq -r '.sourceCommit // empty' release-request.json)
          test "$APPROVED" = "true" || { echo "release-request.json is not approved"; exit 1; }
          test -n "$SOURCE_COMMIT" || { echo "release-request.json is missing sourceCommit"; exit 1; }
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA" || {
            echo "Approved source commit is not an ancestor of the release approval commit."
            exit 1
          }
          if [ "$GITHUB_REF_NAME" = "architecture-v2" ]; then
            test "$(git rev-parse origin/architecture-v2)" = "$GITHUB_SHA" || { echo "architecture-v2 release must run from current branch HEAD"; exit 1; }
          fi
          EXCLUDES=(':(exclude)release-request.json' ':(exclude)latest-version.json' ':(exclude)docs/INSURANCE_V305_ACCEPTANCE_GATE.json')
          if [ "$UI_ONLY_PUBLICATION" = "true" ]; then
            # Runtime assets stay strictly pinned. Only this reviewed publication
            # controller, its waiver record, and controller tests may differ.
            EXCLUDES+=(':(exclude).github/workflows/publish-approved-release.yml' ':(exclude).github/workflows/reception-check.yml' ':(exclude)scripts/verify-ui-only-release.cjs' ':(exclude)release-ui-request.json' ':(exclude)tests/reception-ui-only-release.mjs')
          fi
          if ! git diff --quiet "$SOURCE_COMMIT" "$GITHUB_SHA" -- . "${EXCLUDES[@]}"; then
            echo "Production source drift detected after approved source commit:"
            git diff --name-only "$SOURCE_COMMIT" "$GITHUB_SHA" -- . ':(exclude)release-request.json'
            exit 1
          fi
          echo "Approved source commit verified: $SOURCE_COMMIT"

      - name: Verify complete V305 acceptance and recovery evidence
        if: env.UI_ONLY_PUBLICATION != 'true'
        run: node scripts/verify-v305-acceptance.cjs

      - name: Verify UI-only compatibility source CI provenance
        if: env.UI_ONLY_PUBLICATION == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UI_VERIFICATION_RUN" > /tmp/ui-verification-run.json
          test "$(jq -r '.head_sha' /tmp/ui-verification-run.json)" = "$(jq -r '.sourceCommit' release-request.json)"
          test "$(jq -r '.head_branch' /tmp/ui-verification-run.json)" = "architecture-v2"
          test "$(jq -r '.path' /tmp/ui-verification-run.json)" = ".github/workflows/reception-check.yml"
          test "$(jq -r '.conclusion' /tmp/ui-verification-run.json)" = "success"
          echo 'Owner requested immediate client UI publication; backup deferred and physical acceptance NOT_RUN. This release performs no backend migration or activation; existing server capability is unchanged.' >> "$GITHUB_STEP_SUMMARY"

      - name: Pin both clients to the approved source
        shell: bash
        run: |
          node scripts/verify-pc-pages-publication.cjs --coordinated >> "$GITHUB_ENV"
          echo "SIGNED_ACCEPTANCE_RUN=$(jq -r '.signedAcceptanceRun' release-request.json)" >> "$GITHUB_ENV"
          echo "APPROVAL_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          cp release-request.json /tmp/zukait-approved-request.json
          git -c advice.detachedHead=false checkout --detach --force "$(jq -r '.sourceCommit' release-request.json)"
          test "$(git rev-parse HEAD)" = "$(jq -r '.sourceCommit' /tmp/zukait-approved-request.json)"

      - name: Resolve approved version
        id: approved
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)
          test -n "$VERSION_NAME" || { echo "Could not read versionName from app/build.gradle"; exit 1; }
          test -n "$VERSION_CODE" || { echo "Could not read versionCode from app/build.gradle"; exit 1; }
          test "$VERSION_NAME" = "$(jq -r '.versionName' /tmp/zukait-approved-request.json)" || { echo "Approved versionName does not match app"; exit 1; }
          test "$VERSION_CODE" = "$(jq -r '.versionCode' /tmp/zukait-approved-request.json)" || { echo "Approved versionCode does not match app"; exit 1; }
          echo "Resolved production version: $VERSION_NAME (code $VERSION_CODE)"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate JavaScript
        shell: bash
        run: |
          bash scripts/ci-validate-js.sh
      - name: Run functional smoke tests
        shell: bash
        run: |
          bash scripts/ci-full-regression.sh
      - name: Check production assets
        shell: bash
        run: |
          bash scripts/ci-check-production-assets.sh

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: ${{ env.UI_ONLY_PUBLICATION == 'true' && 'Retrieve owner-approved UI signed candidate; physical acceptance NOT_RUN' || 'Retrieve the exact physically accepted signed APK' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNED_ACCEPTANCE_RUN" > /tmp/acceptance-run.json
          test "$(jq -r '.head_sha' /tmp/acceptance-run.json)" = "$SOURCE_SHA"
          test "$(jq -r '.head_branch' /tmp/acceptance-run.json)" = "architecture-v2"
          test "$(jq -r '.path' /tmp/acceptance-run.json)" = ".github/workflows/build-signed-acceptance.yml"
          test "$(jq -r '.conclusion' /tmp/acceptance-run.json)" = "success"
          gh run download "$SIGNED_ACCEPTANCE_RUN" --repo "$GITHUB_REPOSITORY" --name ZUKAIT_SIGNED_ACCEPTANCE_APK --dir /tmp/accepted-apk
          cp /tmp/accepted-apk/ZUKAIT_TIME_TRACK_LATEST.apk ZUKAIT_TIME_TRACK_LATEST.apk

      - name: Sign and verify APK
        shell: bash
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs ZUKAIT_TIME_TRACK_LATEST.apk | tee /tmp/apksigner-verify.txt
          ACTUAL_CERT=$(grep -i "Signer #1 certificate SHA-256 digest:" /tmp/apksigner-verify.txt | head -n 1 | sed 's/.*: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL_CERT" = "$EXPECTED_CERT_SHA256"
          "$BT/aapt" dump badging ZUKAIT_TIME_TRACK_LATEST.apk | head -n 1 | tee /tmp/apk-badging.txt
          grep -q "package: name='$EXPECTED_PACKAGE'" /tmp/apk-badging.txt
          grep -q "versionCode='${{ steps.approved.outputs.version_code }}'" /tmp/apk-badging.txt
          grep -q "versionName='${{ steps.approved.outputs.version_name }}'" /tmp/apk-badging.txt

      - name: Verify accepted APK embedded Reception assets
        run: python3 scripts/verify-reception-platform-assets.py --apk ZUKAIT_TIME_TRACK_LATEST.apk

      - name: Create draft GitHub release
        id: draft_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ZUKAIT_RELEASE_WORKFLOW_TOKEN }}
        run: |
          TAG="release-${{ steps.approved.outputs.version_name }}${{ github.ref_name == 'architecture-v2' && '-architecture-v2' || '' }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release tag already exists; retain it and require operator reconciliation."
            exit 1
          fi
          RELEASE_JSON=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="${SOURCE_SHA}" \
            -f name="Zukait Time Track ${{ steps.approved.outputs.version_name }}" \
            -f body="Owner-approved ${{ steps.approved.outputs.version_name }}. UI-only publication: ${UI_ONLY_PUBLICATION}. Source ${SOURCE_SHA}. No backend migrations in this release. Existing live server capability is unchanged. Backup deferred and physical acceptance NOT_RUN for UI-only publication." \
            -F draft=true \
            -F prerelease=false)
          RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | jq -r '.id // empty')
          RELEASE_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.html_url // empty')
          test -n "$RELEASE_ID" || { echo "Draft release ID was not returned"; exit 1; }
          test -n "$RELEASE_URL" || { echo "Draft release URL was not returned"; exit 1; }
          UPLOAD_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.upload_url // empty' | sed 's/{?name,label}//')
          test -n "$UPLOAD_URL" || { echo "Draft release upload URL was not returned"; exit 1; }
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @ZUKAIT_TIME_TRACK_LATEST.apk \
            "${UPLOAD_URL}?name=ZUKAIT_TIME_TRACK_LATEST.apk" >/tmp/release-asset.json
          test "$(jq -r '.name' /tmp/release-asset.json)" = "ZUKAIT_TIME_TRACK_LATEST.apk"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Prepare PC site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp app/src/main/assets/offline_test.html _site/index.html
          cp app/src/main/assets/receptionist.html _site/receptionist.html
          cp app/src/main/assets/receptionist_session.js _site/receptionist_session.js
          cp app/src/main/assets/consumables.js _site/consumables.js
          cp app/src/main/assets/consumables_ui.js _site/consumables_ui.js
          cp app/src/main/assets/paint_module.js _site/paint_module.js
          cp app/src/main/assets/job_cost_summary_v128.js _site/job_cost_summary_v128.js
          cp app/src/main/assets/cloud_sync.js _site/cloud_sync.js
          cp app/src/main/assets/secure_auth.js _site/secure_auth.js
          cp app/src/main/assets/production_pilot.js _site/production_pilot.js
          cp app/src/main/assets/professional_ux.js _site/professional_ux.js
          cp app/src/main/assets/v54_improvements.js _site/v54_improvements.js
          cp app/src/main/assets/v63_updates.js _site/v63_updates.js
          cp app/src/main/assets/v65_updates.js _site/v65_updates.js
          cp app/src/main/assets/v66_updates.js _site/v66_updates.js
          cp app/src/main/assets/v67_updates.js _site/v67_updates.js
          cp app/src/main/assets/v68_updates.js _site/v68_updates.js
          cp app/src/main/assets/v69_updates.js _site/v69_updates.js
          cp app/src/main/assets/v74_updates.js _site/v74_updates.js
          mkdir -p _site/v2/features/spare-parts
          cp app/src/main/assets/v2/features/spare-parts/workflow.js _site/v2/features/spare-parts/workflow.js
          cp app/src/main/assets/v2/features/spare-parts/main_module.js _site/v2/features/spare-parts/main_module.js
          cp app/src/main/assets/zukait_logo.webp _site/zukait_logo.webp
          cp -R app/src/main/assets/vehicle-logos _site/vehicle-logos
          cp app/src/main/assets/qc_delivery_rules.js _site/qc_delivery_rules.js
          cp app/src/main/assets/time_management_rules.js _site/time_management_rules.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from shutil import copy2

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      src = dict(attrs).get('src')
                      if src:
                          self.sources.append(src.split('?', 1)[0])

          assets = Path('app/src/main/assets')
          parser = Scripts()
          parser.feed((assets / 'offline_test.html').read_text(encoding='utf-8'))
          for source in parser.sources:
              relative = Path(source)
              if relative.is_absolute() or '..' in relative.parts:
                  raise ValueError(f'Unsafe script path: {source}')
              origin = assets / relative
              if not origin.is_file():
                  raise FileNotFoundError(origin)
              destination = Path('_site') / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              copy2(origin, destination)
          print(f'Copied {len(parser.sources)} referenced scripts')
          PY
          test -s _site/receptionist.html
          test -s _site/receptionist_session.js
          test -s _site/consumables.js
          test -s _site/consumables_ui.js
          test -s _site/paint_module.js
          test -s _site/job_cost_summary_v128.js
          grep -q 'openPaintModule' _site/paint_module.js
          grep -q 'v128JobCostData' _site/job_cost_summary_v128.js
          grep -q 'openConsumablesModule' _site/consumables_ui.js
          grep -q 'consumables_ui.js' _site/index.html
          test -s _site/v54_improvements.js
          test -s _site/v63_updates.js
          test -s _site/v65_updates.js
          test -s _site/v66_updates.js
          test -s _site/v67_updates.js
          test -s _site/v68_updates.js
          test -s _site/v69_updates.js
          test -s _site/v74_updates.js
          test -s _site/v2/features/spare-parts/workflow.js
          test -s _site/v2/features/spare-parts/main_module.js
          grep -q 'sparePartsMain:{' _site/v2/features/spare-parts/main_module.js
          grep -q 'open:render' _site/v2/features/spare-parts/main_module.js
          grep -q 'window.openSparePartsModule=render' _site/v2/features/spare-parts/main_module.js
          test -s _site/vehicle-logos/cadillac.svg
          test -s _site/vehicle-logos/gmc.svg
          test -s _site/vehicle-logos/chevrolet.svg
          test -s _site/vehicle-logos/ford.svg
          test -s _site/vehicle-logos/honda.svg
          touch _site/.nojekyll

      - name: Verify staged shared Reception UI assets before public deployment
        run: python3 scripts/verify-reception-platform-assets.py --site _site

      - name: Create source and asset integrity manifest
        run: node scripts/verify-coordinated-release.cjs manifest _site

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy coordinated Pages candidate
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Pages bytes before advancing staff APK
        run: node scripts/verify-coordinated-release.cjs pages _site

      - name: Make approved release public and latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ZUKAIT_RELEASE_WORKFLOW_TOKEN }}
        run: |
          RELEASE_ID="${{ steps.draft_release.outputs.release_id }}"
          EXPECTED_TAG="release-${{ steps.approved.outputs.version_name }}${{ github.ref_name == 'architecture-v2' && '-architecture-v2' || '' }}"
          test -n "$RELEASE_ID" || { echo "Missing draft release ID"; exit 1; }

          # Publish V178 and explicitly request repository-wide latest status.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input - >/tmp/published-release.json <<'JSON'
          {"draft":false,"make_latest":"true"}
          JSON

          # GitHub can retain an older manually pinned "latest" release even after
          # a newer release is published. Reset that stale pin to legacy selection,
          # re-pin this release, and poll until the public /releases/latest endpoint
          # confirms the expected release.
          LATEST_JSON='{}'
          LATEST_ID=''
          for attempt in 1 2 3 4 5; do
            LATEST_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null || printf '{}')
            LATEST_ID=$(printf '%s' "$LATEST_JSON" | jq -r '.id // empty')
            [ "$LATEST_ID" = "$RELEASE_ID" ] && break

            echo "Latest release pointer is stale (expected $RELEASE_ID, got ${LATEST_ID:-none}); repairing attempt $attempt/5."
            if [ -n "$LATEST_ID" ]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${LATEST_ID}" --input - >/tmp/previous-latest-release.json <<'JSON'
          {"make_latest":"legacy"}
          JSON
            fi

            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input - >/tmp/published-release.json <<'JSON'
          {"draft":false,"make_latest":"true"}
          JSON
            sleep 2
          done

          LATEST_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")
          LATEST_ID=$(printf '%s' "$LATEST_JSON" | jq -r '.id // empty')
          LATEST_TAG=$(printf '%s' "$LATEST_JSON" | jq -r '.tag_name // empty')
          test "$LATEST_ID" = "$RELEASE_ID" || {
            echo "GitHub latest release pointer verification failed: expected ID $RELEASE_ID, got ${LATEST_ID:-none}"
            exit 1
          }
          test "$LATEST_TAG" = "$EXPECTED_TAG" || {
            echo "GitHub latest release tag verification failed: expected $EXPECTED_TAG, got ${LATEST_TAG:-none}"
            exit 1
          }
          test "$(jq -r '.draft' /tmp/published-release.json)" = "false"
          test "$(jq -r '.prerelease' /tmp/published-release.json)" = "false"
          test "$(jq -r '[.assets[].name] | index("ZUKAIT_TIME_TRACK_LATEST.apk") != null' /tmp/published-release.json)" = "true"
          jq '{tag_name,name,draft,prerelease,html_url,assets:[.assets[].name]}' /tmp/published-release.json

      - name: Verify public signed APK before updater publication
        run: node scripts/verify-coordinated-release.cjs apk _site

      - name: Publish matching update metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('latest-version.json')
          d={
            "versionCode": int("${{ steps.approved.outputs.version_code }}"),
            "versionName": "${{ steps.approved.outputs.version_name }}",
            "status": "current",
            "package": "com.zukait.timetrack",
            "sourceCommit": __import__('os').environ['SOURCE_SHA'],
            "apkSha256": __import__('hashlib').sha256(Path('ZUKAIT_TIME_TRACK_LATEST.apk').read_bytes()).hexdigest(),
            "releaseTag": "release-${{ steps.approved.outputs.version_name }}-architecture-v2"

          }
          p.write_text(json.dumps(d, indent=2)+"\n", encoding='utf-8')
          PY
          cp latest-version.json /tmp/zukait-published-version.json
          git checkout --detach --force "$APPROVAL_SHA"
          cp /tmp/zukait-published-version.json latest-version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-version.json
          git diff --cached --quiet || git commit -m "Publish ${{ steps.approved.outputs.version_name }} update metadata"
          # Never rebase a release pointer onto unverified application changes.
          test "$(git ls-remote origin refs/heads/architecture-v2 | cut -f1)" = "$APPROVAL_SHA"
          git push --force-with-lease="refs/heads/architecture-v2:$APPROVAL_SHA" origin HEAD:architecture-v2

      - name: Verify public updater and downloadable APK parity
        run: node scripts/verify-coordinated-release.cjs release _site

      - name: Preserve coordinated release evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coordinated-release-${{ github.run_id }}
          path: |
            _site/release-integrity.json
            coordinated-*.json
          if-no-files-found: warn
          retention-days: 90
