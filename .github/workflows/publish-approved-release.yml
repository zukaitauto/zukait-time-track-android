name: Publish Approved Signed APK

on:
  # Publishing a staff APK is an explicit action, never a side effect of a
  # release-request edit, QA push, or a commit on main.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/architecture-v2'
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      EXPECTED_PACKAGE: com.zukait.timetrack
      EXPECTED_CERT_SHA256: 63886438214503d468f053b44afe34baf008019f674e065a09b14ae8bf451af0
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify approved source commit
        shell: bash
        run: |
          APPROVED=$(jq -r '.approvedForStaff // false' release-request.json)
          SOURCE_COMMIT=$(jq -r '.sourceCommit // empty' release-request.json)
          test "$APPROVED" = "true" || { echo "release-request.json is not approved"; exit 1; }
          test -n "$SOURCE_COMMIT" || { echo "release-request.json is missing sourceCommit"; exit 1; }
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA" || {
            echo "Approved source commit is not an ancestor of the release approval commit."
            exit 1
          }
          if [ "$GITHUB_REF_NAME" = "architecture-v2" ]; then
            test "$(git rev-parse origin/architecture-v2)" = "$GITHUB_SHA" || { echo "architecture-v2 release must run from current branch HEAD"; exit 1; }
          fi
          if ! git diff --quiet "$SOURCE_COMMIT" "$GITHUB_SHA" -- . ':(exclude)release-request.json' ':(exclude)latest-version.json' ':(exclude)app/build.gradle' ':(exclude).github/workflows/publish-approved-release.yml' ':(exclude).github/workflows/build-apk.yml'; then
            echo "Production source drift detected after approved source commit:"
            git diff --name-only "$SOURCE_COMMIT" "$GITHUB_SHA" -- . ':(exclude)release-request.json'
            exit 1
          fi
          echo "Approved source commit verified: $SOURCE_COMMIT"

      - name: Resolve approved version
        id: approved
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)
          test -n "$VERSION_NAME" || { echo "Could not read versionName from app/build.gradle"; exit 1; }
          test -n "$VERSION_CODE" || { echo "Could not read versionCode from app/build.gradle"; exit 1; }
          test "$VERSION_NAME" = "$(jq -r '.versionName' release-request.json)" || { echo "Approved versionName does not match app"; exit 1; }
          test "$VERSION_CODE" = "$(jq -r '.versionCode' release-request.json)" || { echo "Approved versionCode does not match app"; exit 1; }
          echo "Resolved production version: $VERSION_NAME (code $VERSION_CODE)"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate JavaScript
        shell: bash
        run: |
          bash scripts/ci-validate-js.sh
      - name: Run functional smoke tests
        shell: bash
        run: |
          bash scripts/ci-full-regression.sh
      - name: Check production assets
        shell: bash
        run: |
          bash scripts/ci-check-production-assets.sh

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Restore permanent signing key
        shell: bash
        env:
          NEW_KEYSTORE: ${{ secrets.ZUKAIT_SIGNING_JKS_BASE64 }}
          LEGACY_KEYSTORE: ${{ secrets.ZUKAIT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NEW_KEYSTORE" ]; then
            printf '%s' "$NEW_KEYSTORE" | base64 -d > /tmp/zukait-release.jks
          elif [ -n "$LEGACY_KEYSTORE" ]; then
            printf '%s' "$LEGACY_KEYSTORE" | base64 -d > /tmp/zukait-release.jks
          else
            echo "No permanent Zukait signing keystore secret is available."
            exit 1
          fi
          test -s /tmp/zukait-release.jks

      - name: Sign and verify APK
        shell: bash
        env:
          ZUKAIT_KEY_ALIAS: ${{ secrets.ZUKAIT_KEY_ALIAS }}
          NEW_STORE_PASSWORD: ${{ secrets.ZUKAIT_STORE_PASSWORD }}
          LEGACY_STORE_PASSWORD: ${{ secrets.ZUKAIT_KEYSTORE_PASSWORD }}
          ZUKAIT_KEY_PASSWORD: ${{ secrets.ZUKAIT_KEY_PASSWORD }}
        run: |
          STORE_PASSWORD="$NEW_STORE_PASSWORD"
          [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$LEGACY_STORE_PASSWORD"
          test -n "$ZUKAIT_KEY_ALIAS" || { echo "Missing signing key alias"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing keystore password"; exit 1; }
          test -n "$ZUKAIT_KEY_PASSWORD" || { echo "Missing key password"; exit 1; }
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/zukait-release.jks \
            --ks-key-alias "$ZUKAIT_KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$ZUKAIT_KEY_PASSWORD" \
            --out ZUKAIT_TIME_TRACK_LATEST.apk \
            /tmp/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs ZUKAIT_TIME_TRACK_LATEST.apk | tee /tmp/apksigner-verify.txt
          ACTUAL_CERT=$(grep -i "Signer #1 certificate SHA-256 digest:" /tmp/apksigner-verify.txt | head -n 1 | sed 's/.*: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL_CERT" = "$EXPECTED_CERT_SHA256"
          "$BT/aapt" dump badging ZUKAIT_TIME_TRACK_LATEST.apk | head -n 1 | tee /tmp/apk-badging.txt
          grep -q "package: name='$EXPECTED_PACKAGE'" /tmp/apk-badging.txt
          grep -q "versionCode='${{ steps.approved.outputs.version_code }}'" /tmp/apk-badging.txt
          grep -q "versionName='${{ steps.approved.outputs.version_name }}'" /tmp/apk-badging.txt

      - name: Create draft GitHub release
        id: draft_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="release-${{ steps.approved.outputs.version_name }}${{ github.ref_name == 'architecture-v2' && '-architecture-v2' || '' }}"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          RELEASE_JSON=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="${GITHUB_SHA}" \
            -f name="Zukait Time Track ${{ steps.approved.outputs.version_name }}" \
            -f body="Approved signed production release ${{ steps.approved.outputs.version_name }}." \
            -F draft=true \
            -F prerelease=false)
          RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | jq -r '.id // empty')
          RELEASE_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.html_url // empty')
          test -n "$RELEASE_ID" || { echo "Draft release ID was not returned"; exit 1; }
          test -n "$RELEASE_URL" || { echo "Draft release URL was not returned"; exit 1; }
          UPLOAD_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.upload_url // empty' | sed 's/{?name,label}//')
          test -n "$UPLOAD_URL" || { echo "Draft release upload URL was not returned"; exit 1; }
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @ZUKAIT_TIME_TRACK_LATEST.apk \
            "${UPLOAD_URL}?name=ZUKAIT_TIME_TRACK_LATEST.apk" >/tmp/release-asset.json
          test "$(jq -r '.name' /tmp/release-asset.json)" = "ZUKAIT_TIME_TRACK_LATEST.apk"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Publish matching update metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('latest-version.json')
          d={
            "versionCode": int("${{ steps.approved.outputs.version_code }}"),
            "versionName": "${{ steps.approved.outputs.version_name }}",
            "status": "current",
            "package": "com.zukait.timetrack"
          }
          p.write_text(json.dumps(d, indent=2)+"\n", encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-version.json
          git diff --cached --quiet || git commit -m "Publish ${{ steps.approved.outputs.version_name }} update metadata"
          # Main may advance while this signed release is building (for example a UI/cache-only commit).
          # Rebase the metadata commit onto the newest main and retry instead of failing non-fast-forward.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Metadata push raced with another main update; retrying ($attempt/3)."
            sleep 2
          done
          echo "Unable to publish update metadata after 3 rebased attempts."
          exit 1

      - name: Make approved release public and latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ID="${{ steps.draft_release.outputs.release_id }}"
          EXPECTED_TAG="release-${{ steps.approved.outputs.version_name }}${{ github.ref_name == 'architecture-v2' && '-architecture-v2' || '' }}"
          test -n "$RELEASE_ID" || { echo "Missing draft release ID"; exit 1; }

          # Publish V178 and explicitly request repository-wide latest status.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input - >/tmp/published-release.json <<'JSON'
          {"draft":false,"make_latest":"true"}
          JSON

          # GitHub can retain an older manually pinned "latest" release even after
          # a newer release is published. Reset that stale pin to legacy selection,
          # re-pin this release, and poll until the public /releases/latest endpoint
          # confirms the expected release.
          LATEST_JSON='{}'
          LATEST_ID=''
          for attempt in 1 2 3 4 5; do
            LATEST_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null || printf '{}')
            LATEST_ID=$(printf '%s' "$LATEST_JSON" | jq -r '.id // empty')
            [ "$LATEST_ID" = "$RELEASE_ID" ] && break

            echo "Latest release pointer is stale (expected $RELEASE_ID, got ${LATEST_ID:-none}); repairing attempt $attempt/5."
            if [ -n "$LATEST_ID" ]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${LATEST_ID}" --input - >/tmp/previous-latest-release.json <<'JSON'
          {"make_latest":"legacy"}
          JSON
            fi

            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input - >/tmp/published-release.json <<'JSON'
          {"draft":false,"make_latest":"true"}
          JSON
            sleep 2
          done

          LATEST_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")
          LATEST_ID=$(printf '%s' "$LATEST_JSON" | jq -r '.id // empty')
          LATEST_TAG=$(printf '%s' "$LATEST_JSON" | jq -r '.tag_name // empty')
          test "$LATEST_ID" = "$RELEASE_ID" || {
            echo "GitHub latest release pointer verification failed: expected ID $RELEASE_ID, got ${LATEST_ID:-none}"
            exit 1
          }
          test "$LATEST_TAG" = "$EXPECTED_TAG" || {
            echo "GitHub latest release tag verification failed: expected $EXPECTED_TAG, got ${LATEST_TAG:-none}"
            exit 1
          }
          test "$(jq -r '.draft' /tmp/published-release.json)" = "false"
          test "$(jq -r '.prerelease' /tmp/published-release.json)" = "false"
          test "$(jq -r '[.assets[].name] | index("ZUKAIT_TIME_TRACK_LATEST.apk") != null' /tmp/published-release.json)" = "true"
          jq '{tag_name,name,draft,prerelease,html_url,assets:[.assets[].name]}' /tmp/published-release.json

