name: Publish Accountant Stock Web Only (V421 APK unchanged)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  accountant-stock-web-repair:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/architecture-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: https://zukaitauto.github.io/zukait-time-track-android/accountant.html
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test Accountant Stock layout and role isolation
        run: |
          npm ci --ignore-scripts --include=dev
          node tests/accountant-stock-workspace.mjs
          node tests/accountant-stock-authority.mjs
          node tests/accountant-stock-master-api.mjs
          node tests/consumables-invoice-price-api.mjs
          node tests/consumables-invoice-price-reconcile-api.mjs
      - name: Verify source-bound Accountant web layout update
        run: |
          git merge-base --is-ancestor 5e02808249f536505d115d2f054651c161617408 "$GITHUB_SHA"
          python3 scripts/accountant-stock-web-repair.py selftest
          python3 scripts/accountant-stock-web-layout.py prepare
          node --check _site/accountant_stock.js
          node --check _site/accountant.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for uploaded Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" | jq -e '.artifacts | any(.name == "github-pages" and .expired == false)' >/dev/null; then
              echo "Pages artifact indexed"
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub Pages artifact not indexed"
          exit 1
      - name: Publish V421 web-only asset repair
        uses: actions/deploy-pages@v4
      - name: Verify repaired Accountant scripts and preserved site
        run: python3 scripts/accountant-stock-web-layout.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accountant-stock-web-repair-evidence
          path: artifacts/accountant-stock-web-repair/
          retention-days: 14
