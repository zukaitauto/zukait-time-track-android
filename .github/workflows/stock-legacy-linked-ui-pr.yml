name: V415 Legacy Stock linking UI regression
on:
  pull_request:
    branches: [architecture-v2]
    paths:
      - 'app/src/main/assets/consumables_stock_ui.js'
      - 'tests/consumables-stock-home-responsive.mjs'
      - 'app/src/main/assets/consumables_ui.js'
      - 'app/src/main/assets/consumables.js'
      - 'tests/consumables-invoice-price-review.mjs'
      - 'tests/consumables-invoice-price-api.mjs'
      - 'tests/consumables-invoice-price-commit-sql.mjs'
      - 'supabase/functions/workshop-api/extensions/invoice_price_*.js'
      - 'supabase/functions/workshop-api/index.ts'
      - 'supabase/staged/CONSUMABLES_INVOICE_PRICE_APPLY.sql'
      - 'tests/consumables-master-mobile-responsive.mjs'
      - 'tests/consumables-stock-legacy-linked-ui.mjs'
      - 'package.json'
      - '.github/workflows/stock-legacy-linked-ui-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check app/src/main/assets/consumables_stock_ui.js
          node --check tests/consumables-stock-legacy-linked-ui.mjs
          node --check app/src/main/assets/consumables_ui.js
          node --check tests/consumables-master-mobile-responsive.mjs
          node --check tests/consumables-stock-home-responsive.mjs
      - name: Run all isolated Stock regressions
        run: npm run test:consumables:stock
      - name: Verify preview-only application safety
        run: node tests/consumables-main-app-preview.mjs
      - name: Verify original Material Master create, brand and price functionality
        run: |
          node tests/consumables-ui.mjs
          node tests/consumables-invoice-price-review.mjs
          node tests/consumables-invoice-price-api.mjs
          node tests/consumables-invoice-price-commit-sql.mjs
      - name: Check Manager Materials and Brand Price modal on iPhone and desktop
        run: |
          npx playwright install chromium
          node tests/consumables-master-mobile-responsive.mjs
          node tests/consumables-stock-home-responsive.mjs
