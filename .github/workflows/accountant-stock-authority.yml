name: Accountant Stock role gate
on:
  pull_request:
    paths:
      - 'supabase/functions/workshop-api/extensions/consumables_stock_api.js'
      - 'supabase/staged/ACCOUNTANT_STOCK_ENTRY_AUTHORITY.sql'
      - 'tests/accountant-stock-authority.mjs'
      - '.github/workflows/accountant-stock-authority.yml'
permissions:
  contents: read
jobs:
  role-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tests/accountant-stock-authority.mjs
          node tests/consumables-stock-api.mjs
