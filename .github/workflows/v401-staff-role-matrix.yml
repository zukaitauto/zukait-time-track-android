name: V401 isolated authenticated staff role workflow matrix
on:
  workflow_dispatch:
  push:
    branches: [architecture-v2]
    paths:
      - 'tests/v401-staff-login-role-matrix.mjs'
      - 'tests/reception-receptionist-auth.mjs'
      - 'tests/accountant-auth-api.mjs'
      - 'tests/mechanical-inspection-api.mjs'
      - 'supabase/functions/staff-auth/index.ts'
      - 'supabase/functions/workshop-api/accountant/**'
      - 'supabase/functions/workshop-api/extensions/mechanical_inspection_*.js'
      - '.github/workflows/v401-staff-role-matrix.yml'
permissions:
  contents: read
jobs:
  role-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --include=dev
      - name: Verify real staff-auth code across synthetic active and inactive logins
        run: node --disable-warning=ExperimentalWarning tests/v401-staff-login-role-matrix.mjs
      - name: Test production auth code against isolated PostgreSQL Accountant database
        run: node --disable-warning=ExperimentalWarning tests/accountant-auth-api.mjs
      - name: Verify Receptionist registration, login, password change and revocation
        run: node --disable-warning=ExperimentalWarning tests/reception-receptionist-auth.mjs
      - name: Verify Mechanical Inspection authorization gate and workflow
        run: |
          node tests/mechanical-inspection-api.mjs
          node tests/mechanical-inspection-session.mjs
      - name: Live v14 and v126 invalid-session smoke checks (read-only)
        run: |
          set -euo pipefail
          BASE='https://pjknotnjkufadqavcmii.supabase.co/functions/v1'
          KEY='sb_publishable_-sg597IpB0MLIHdDoedRIA_MTt0Sa9A'
          for ACTION in accountant_dashboard mechanical_inspection technician_roster; do
            RESPONSE=$(curl --silent --show-error --max-time 25 --output /tmp/denied.json --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --header "apikey: $KEY" \
              --header 'x-zukait-session: INVALID-V401-ROLE-MATRIX-SESSION' \
              --data "{\"action\":\"$ACTION\"}" "$BASE/workshop-api")
            if [ "$RESPONSE" != 401 ]; then echo "::error::$ACTION accepted unexpected status $RESPONSE"; cat /tmp/denied.json; exit 1; fi
          done
          RESPONSE=$(curl --silent --show-error --max-time 25 --output /tmp/auth-denied.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --header "apikey: $KEY" \
            --data '{"action":"session","session_token":"INVALID-V401-ROLE-MATRIX-SESSION"}' "$BASE/staff-auth")
          test "$RESPONSE" = 401 || { echo "::error::staff-auth accepted invalid session ($RESPONSE)"; cat /tmp/auth-denied.json; exit 1; }
