name: Consumables stock safety tests
on:
  workflow_dispatch:
  push:
    branches: [feature/consumables-stock-core-20261120]
    paths:
      - 'app/src/main/assets/consumables_stock_core.js'
      - 'app/src/main/assets/consumables_stock_ui.js'
      - 'app/src/main/assets/consumables_ui.js'
      - 'app/src/main/assets/cloud_sync.js'
      - 'supabase/staged/CONSUMABLES_STOCK_COMPACT_*.sql'
      - 'supabase/functions/workshop-api/**'
      - 'tests/consumables-stock-*.mjs'
      - '.github/workflows/consumables-stock-core.yml'
  pull_request:
    branches: [architecture-v2]
jobs:
  stock-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies (isolated CI only)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate stock JavaScript syntax
        run: |
          node --check app/src/main/assets/consumables_stock_core.js
          node --check app/src/main/assets/consumables_stock_ui.js
          node --check app/src/main/assets/consumables_ui.js
          node --check app/src/main/assets/cloud_sync.js
      - name: Transaction core behavior
        run: node tests/consumables-stock-core.mjs
      - name: Feature-flagged API boundaries
        run: node tests/consumables-stock-api.mjs
      - name: Isolated PostgreSQL stock lifecycle
        run: node tests/consumables-stock-sql.mjs
