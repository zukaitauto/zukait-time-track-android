name: Backend timing package check
on:
  push:
    branches:
      - integration/backend-timing-optimization-20261127
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Resolve and type-check complete API
        working-directory: supabase/functions/workshop-api
        run: deno check index.ts
