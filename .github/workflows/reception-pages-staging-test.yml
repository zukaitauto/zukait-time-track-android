name: Validate staged PC website before V305 deployment

on:
  workflow_dispatch:
  push:
    branches: [architecture-v2]
    paths:
      - ".github/workflows/reception-pages-staging-test.yml"
      - ".github/workflows/pages.yml"
      - "scripts/verify-reception-platform-assets.py"
      - "app/src/main/assets/offline_test.html"
      - "app/src/main/assets/receptionist.html"
      - "app/src/main/assets/receptionist_session.js"
      - "app/src/main/assets/v2/features/insurance/reception.js"
      - "app/src/main/assets/reception_dashboard.js"

permissions:
  contents: read

jobs:
  staging-only:
    if: github.ref == 'refs/heads/architecture-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact Pages packaging commands without deployment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          content=Path(".github/workflows/pages.yml").read_text()
          marker="      - name: Prepare PC site\n"
          next_marker="      - name: Verify staged shared Reception UI assets before public deployment\n"
          assert content.count(marker)==1 and content.count(next_marker)==1
          block=content.split(marker,1)[1].split(next_marker,1)[0]
          prefix="        run: |\n"
          assert block.count(prefix)==1
          lines=block.split(prefix,1)[1].splitlines()
          assert lines and all(not line or line.startswith("          ") for line in lines)
          shell="\n".join(line[10:] if line else "" for line in lines)+"\n"
          assert shell.lstrip().startswith("rm -rf _site\n")
          assert "touch _site/.nojekyll" in shell
          assert "copy2(origin, destination)" in shell
          # Defensive: the extracted step must be only local static-site staging.
          for forbidden in ("actions/deploy-pages", "curl ", "git push", "gh release",
                            "supabase ", "aws ", "rsync ", "rm -rf /"):
              assert forbidden not in shell, f"Unexpected operation in site staging: {forbidden}"
          target=Path("/tmp/zukait-pages-site-stage.sh")
          target.write_text("set -euo pipefail\n"+shell)
          print("Extracted exact Pages build step to staging-only local test")
          PY
      - name: Stage entire PC website assets without publishing
        shell: bash
        run: bash /tmp/zukait-pages-site-stage.sh
      - name: Verify staged Receptionist page and Android-shared UI bytes
        run: python3 scripts/verify-reception-platform-assets.py --site _site
      - name: Record staging evidence (no deployment)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path("_site")
          names=["index.html","receptionist.html","receptionist_session.js",
                 "reception_dashboard.js","v2/features/insurance/reception.js"]
          evidence={"site":"STAGED_ONLY_NOT_PUBLISHED",
                    "source_sha":os.environ["GITHUB_SHA"],
                    "files":{p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in names}}
          Path("reception-pc-staging-evidence.json").write_text(json.dumps(evidence,indent=2)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## PC staging: verified, NOT deployed\n")
              f.write("Full original Pages packaging ran in temporary CI; both Reception entrypoints and shared UI hashes match source. No live hosting change, API calls, database writes, or release approval.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ZUKAIT_V305_PC_STAGING_NOT_DEPLOYED
          path: |
            _site/
            reception-pc-staging-evidence.json
          if-no-files-found: error
          retention-days: 14
