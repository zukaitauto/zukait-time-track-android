name: Vehicle index isolated foundation
on:
  pull_request:
    branches: [architecture-v2]
    paths:
      - 'app/src/main/assets/vehicle_index*'
      - 'tests/vehicle-index.mjs'
      - 'tests/vehicle-index-autocomplete.mjs'
      - 'app/src/main/assets/v2/features/insurance/reception.js'
      - 'app/src/main/assets/job_card_edit.js'
      - 'app/src/main/assets/manager_job_edit.js'
      - 'app/src/main/assets/mechanical_prejob_intake.js'
      - '.github/workflows/vehicle-index.yml'
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/src/main/assets/vehicle_index.js
      - run: node tests/vehicle-index.mjs
      - run: node tests/vehicle-global-identity.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/vehicle-index-autocomplete.mjs
      - run: node tests/reception-vehicle-authority.mjs
      - run: node tests/mechanical-inspection-boundary.mjs
      - run: node tests/mechanical-inspection-session.mjs
