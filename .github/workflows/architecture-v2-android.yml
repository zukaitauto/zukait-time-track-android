name: Android architecture-v2 build\n# Build verification revision 2

on:
  push:
    branches:
      - architecture-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Publish V244 updater APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ZUKAIT_TIME_TRACK_LATEST.apk
          TAG="release-V244-architecture-v2"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ZUKAIT_TIME_TRACK_LATEST.apk --clobber
          else
            gh release create "$TAG" ZUKAIT_TIME_TRACK_LATEST.apk --title "Zukait Time Track V244" --notes "V244 Android release · versionCode 207"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zukait-time-track-V244-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
