name: Android architecture-v2 build\n# Build verification revision 2

on:
  push:
    branches:
      - architecture-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify loaded scripts and regression paths
        run: |
          bash scripts/ci-validate-js.sh
          node tests/completed-overdue-runtime.mjs
          node tests/manager-header-menu-runtime.mjs
          node tests/secure-session-restore.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug


      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zukait-time-track-architecture-v2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
