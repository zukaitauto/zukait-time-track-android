name: V377 Mechanical Inspection Isolated Tests
on:
  push:
    branches: [architecture-v2]
    paths:
      - 'supabase/functions/workshop-api/extensions/mechanical_inspection_*.js'
      - 'tests/mechanical-inspection-*.mjs'
      - 'app/src/main/assets/mechanical_inspection_view.js'
      - 'app/src/main/assets/mechanical_supervisor.js'
      - 'app/src/main/assets/mechanical_workspace.js'
      - 'supabase/migrations/20261031120000_mechanical_inspection_secure.sql'
      - '.github/workflows/v377-mechanical-inspection-tests.yml'
      - 'package.json'
      - 'experiments/v377-mechanical-inspection-*.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check supabase/functions/workshop-api/extensions/mechanical_inspection_api.js
          node --check supabase/functions/workshop-api/extensions/mechanical_inspection_read_adapter.js
          node --check supabase/functions/workshop-api/extensions/mechanical_inspection_save_adapter.js
          node --check supabase/functions/workshop-api/extensions/mechanical_inspection_boundary.js
          node --check supabase/functions/workshop-api/extensions/mechanical_inspection_storage.js
          node --check app/src/main/assets/mechanical_inspection_view.js
          node --check app/src/main/assets/mechanical_supervisor.js
          node --check app/src/main/assets/mechanical_workspace.js
          for file in tests/mechanical-inspection-*.mjs; do node --check "$file"; done
      - name: Install browser DOM test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run isolated tests
        run: |
          npm run test:mechanical:inspection
          node tests/mechanical-inspection-view.mjs


  isolated-chromium-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Use HTTPS Ubuntu mirrors for Chromium dependencies
        run: |
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - run: npx playwright install --with-deps chromium
      - name: Verify real mobile and desktop Chromium inspection flow
        run: node tests/mechanical-inspection-browser.mjs
      - name: Save Mechanical inspection screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v377-inspection-browser-${{ github.run_id }}
          path: artifacts/v377-inspection/
          if-no-files-found: warn
          retention-days: 14

  isolated-postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZUKAIT_MECHANICAL_NATIVE: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: isolated-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Install local PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Execute isolated SQL schema and atomic-save regression
        run: |
          node tests/mechanical-inspection-migration-postgres.mjs
          node tests/mechanical-inspection-postgres.mjs

  hosted-qa-denial-smoke:
    # Read-only traffic against the separate QA Edge Function. Never creates
    # sessions, authorizes a user, or accesses the production project.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZUKAIT_QA_REF: omqgkqknbdcnotabffek
      ZUKAIT_QA_PUBLIC_KEY: sb_publishable_DBp6FI8Z4ThAq_4LXrZXSg_Xw2uPPgO
    steps:
      - name: Check QA-only host, CORS, API key and session denial
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          ref=os.environ['ZUKAIT_QA_REF']
          assert ref=='omqgkqknbdcnotabffek', 'The QA test must not target another project'
          url=f'https://{ref}.supabase.co/functions/v1/workshop-api'
          key=os.environ['ZUKAIT_QA_PUBLIC_KEY']
          assert key.startswith('sb_publishable_')
          payload=json.dumps({'action':'mechanical_inspection',
              'command':{'operation':'READ_INSPECTION',
              'checklistId':'00000000-0000-4000-8000-000000000000'}}).encode()
          def send(method, apikey=None, session=None):
              headers={'content-type':'application/json'}
              if apikey: headers['apikey']=apikey
              if session: headers['x-zukait-session']=session
              if method=='OPTIONS':
                  headers.update({'origin':'https://qa.example.invalid',
                      'access-control-request-method':'POST',
                      'access-control-request-headers':'apikey,x-zukait-session,content-type'})
              request=Request(url,data=payload if method=='POST' else None,
                  method=method,headers=headers)
              try:
                  with urlopen(request,timeout=20) as response:
                      return response.status,dict(response.headers),response.read(4000)
              except HTTPError as error:
                  return error.code,dict(error.headers),error.read(4000)
          status,headers,body=send('OPTIONS')
          assert status==200, f'CORS preflight rejected: {status}'
          assert headers.get('Access-Control-Allow-Origin')=='*', 'QA CORS not configured'
          status,headers,body=send('POST',apikey='qa-invalid-public-key')
          assert status==401 and json.loads(body).get('code')=='bad_api_key', (
              f'Unknown public key was not rejected: HTTP {status}; {body[:250]!r}')
          status,headers,body=send('POST',apikey=key)
          assert status==401 and json.loads(body).get('code')=='invalid_session', (
              f'Missing staff session was not rejected: HTTP {status}; {body[:250]!r}')
          status,headers,body=send('POST',apikey=key,session='QA-invalid-session-never-authorized')
          assert status==401 and json.loads(body).get('code')=='invalid_session', (
              f'Unrecognized staff session was not rejected: HTTP {status}; {body[:250]!r}')
          print('PASS: Hosted V377 QA Edge is reachable; CORS, publishable key and session validation deny unauthorized reads.')
          print('No staff account, workshop data, production endpoint or test write was used.')
          PY
