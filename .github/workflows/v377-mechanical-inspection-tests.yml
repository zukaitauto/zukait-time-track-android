name: V377 Mechanical Inspection Isolated Tests
on:
  push:
    branches: [architecture-v2]
    paths:
      - 'supabase/functions/workshop-api/extensions/mechanical_inspection_*.js'
      - 'tests/mechanical-inspection-*.mjs'
      - 'app/src/main/assets/mechanical_inspection_view.js'
      - 'app/src/main/assets/mechanical_supervisor.js'
      - 'app/src/main/assets/mechanical_workspace.js'
      - 'supabase/migrations/20261031120000_mechanical_inspection_secure.sql'
      - '.github/workflows/v377-mechanical-inspection-tests.yml'
      - 'package.json'
      - 'experiments/v377-mechanical-inspection-*.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check supabase/functions/workshop-api/extensions/mechanical_inspection_api.js
          node --check supabase/functions/workshop-api/extensions/mechanical_inspection_read_adapter.js
          node --check supabase/functions/workshop-api/extensions/mechanical_inspection_save_adapter.js
          node --check supabase/functions/workshop-api/extensions/mechanical_inspection_boundary.js
          node --check supabase/functions/workshop-api/extensions/mechanical_inspection_storage.js
          node --check app/src/main/assets/mechanical_inspection_view.js
          node --check app/src/main/assets/mechanical_supervisor.js
          node --check app/src/main/assets/mechanical_workspace.js
          for file in tests/mechanical-inspection-*.mjs; do node --check "$file"; done
      - name: Run isolated tests
        run: |
          npm run test:mechanical:inspection

  isolated-postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZUKAIT_MECHANICAL_NATIVE: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: isolated-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Install local PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Execute isolated SQL schema and atomic-save regression
        run: node tests/mechanical-inspection-migration-postgres.mjs
          node tests/mechanical-inspection-postgres.mjs
