name: Vehicle Identifier Uppercase Acceptance

on:
  pull_request:
    branches: [architecture-v2]
    paths:
      - 'app/src/main/assets/vehicle_identifier_uppercase.js'
      - 'app/src/main/assets/offline_test.html'
      - 'app/src/main/assets/receptionist.html'
      - 'app/src/main/assets/mechanical_supervisor.html'
      - 'app/src/main/assets/mechanical_estimate.html'
      - 'app/src/main/assets/accountant.html'
      - 'tests/vehicle-identifier-uppercase.mjs'
      - '.github/workflows/vehicle-identifier-uppercase.yml'
  push:
    branches: [architecture-v2]
    paths:
      - 'app/src/main/assets/vehicle_identifier_uppercase.js'
      - 'app/src/main/assets/offline_test.html'
      - 'app/src/main/assets/receptionist.html'
      - 'app/src/main/assets/mechanical_supervisor.html'
      - 'app/src/main/assets/mechanical_estimate.html'
      - 'app/src/main/assets/accountant.html'
      - 'tests/vehicle-identifier-uppercase.mjs'
permissions:
  contents: read

jobs:
  uppercase-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate VIN and registration input handler syntax
        run: node --check app/src/main/assets/vehicle_identifier_uppercase.js
      - name: Verify all dashboard hosts and input/save behavior
        run: node tests/vehicle-identifier-uppercase.mjs
