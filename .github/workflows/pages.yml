name: Deploy PC App to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare PC site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp app/src/main/assets/offline_test.html _site/index.html
          cp app/src/main/assets/cloud_sync.js _site/cloud_sync.js
          cp app/src/main/assets/secure_auth.js _site/secure_auth.js
          cp app/src/main/assets/production_pilot.js _site/production_pilot.js
          cp app/src/main/assets/zukait_logo.webp _site/zukait_logo.webp
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
